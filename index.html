<script>

const DEFAULT_GOALS={weeklyProfitTarget:0,weeklyTradeTarget:0,dailyLossLimit:0};
function normalizeFinanceEvents(values,kind){const kinds=kind==='fee'?['challenge','reset','activation','data','other']:['payout'];return (Array.isArray(values)?values:[]).slice(-1000).map(value=>({id:String(value?.id||''),accountId:String(value?.accountId||''),kind:kind==='fee'&&kinds.includes(value?.kind)?value.kind:'payout',amount:Number(value?.amount),date:String(value?.date||''),note:typeof value?.note==='string'?value.note.trim().slice(0,240):''})).filter(value=>/^[A-Za-z0-9_-]{1,80}$/.test(value.id)&&/^[A-Za-z0-9_-]{1,80}$/.test(value.accountId)&&Number.isFinite(value.amount)&&value.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(value.date)&&(kind!=='fee'||kinds.includes(value.kind)));}
function defaultSettings(){return {currency:'USD',theme:'dark',activeAccountId:'all',backgroundAnimation:true,goals:{...DEFAULT_GOALS},weeklyReviews:{},accountFees:[],payouts:[]};}
function normalizeSettings(value){const next=Object.assign(defaultSettings(),value||{});next.theme='dark';next.activeAccountId=typeof value?.activeAccountId==='string'?value.activeAccountId:'all';next.backgroundAnimation=value?.backgroundAnimation!==false;next.goals=Object.assign({...DEFAULT_GOALS},value?.goals||{});next.weeklyReviews=value?.weeklyReviews&&typeof value.weeklyReviews==='object'&&!Array.isArray(value.weeklyReviews)?value.weeklyReviews:{};next.accountFees=normalizeFinanceEvents(value?.accountFees,'fee');next.payouts=normalizeFinanceEvents(value?.payouts,'payout');return next;}
let S = { trades: [], settings: defaultSettings(), accounts: [], dailyResults: [] };
let user = null;

let modal = null;
let modalOpener = null;
let lastRenderedModalMode = null;

let backgroundChart = null;

let galleryCompareSelection = [];

let galleryTotalItems = 0;
let galleryViewLimit = 25;

const EMOTIONS = ['Confident','Anxious','Excited','Fearful','Calm','Frustrated','Euphoric','Regretful','Focused','Impulsive'];
const CURRENCIES = ['USD','EUR','GBP','JPY','CAD','AUD','INR'];

function pad(n){ return n<10 ? '0'+n : ''+n; }
function dstr(y,m0,d){ return y+'-'+pad(m0+1)+'-'+pad(d); }
function monthKey(y,m0){ return y+'-'+pad(m0+1); }
function todayStr(){ const t=new Date(); return dstr(t.getFullYear(),t.getMonth(),t.getDate()); }
function weekStartDate(date=new Date()){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function weekKey(date=new Date()){const d=weekStartDate(date);return dstr(d.getFullYear(),d.getMonth(),d.getDate());}
function legacyAccountId(name){let hash=2166136261;for(const ch of String(name).toLocaleLowerCase()){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619);}return 'legacy-'+(hash>>>0).toString(36);}
function normalizeAccounts(values,trades=[]){
  const names=new Set(),ids=new Set(),out=[];
  const source=Array.isArray(values)?values.slice():[];
  const existingNames=new Set(source.map(value=>typeof value==='string'?value.trim():String(value?.name||'').trim()).filter(Boolean).map(name=>name.toLocaleLowerCase()));
  trades.forEach(trade=>{const name=String(trade?.account||'').trim();if(name&&!existingNames.has(name.toLocaleLowerCase())){existingNames.add(name.toLocaleLowerCase());source.push(name);}});
  source.forEach(value=>{
    const legacy=typeof value==='string',name=String(legacy?value:value?.name||'').trim();
    if(!name||name.length>80||names.has(name.toLocaleLowerCase()))return;
    let id=legacy?legacyAccountId(name):String(value?.id||legacyAccountId(name));
    if(!/^[a-zA-Z0-9_-]{1,80}$/.test(id)||ids.has(id))id=legacyAccountId(name);
    if(ids.has(id))return;
    const kind=['personal','prop','demo'].includes(value?.kind)?value.kind:'personal';
    const number=(field)=>{const raw=legacy?0:Number(value?.[field]||0);return Number.isFinite(raw)&&raw>=0&&raw<=1e12?raw:0;};
    const status=['active','passed','funded','failed','closed'].includes(value?.status)?value.status:'active';
    const firm=typeof value?.firm==='string'?value.firm.trim().slice(0,120):'';
    const optionalRule=(field,max)=>{if(value?.[field]==null||value[field]==='')return null;const n=Number(value[field]);return Number.isFinite(n)&&n>=0&&n<=max?n:null;};
    out.push({id,name,kind,firm,currency:CURRENCIES.includes(value?.currency)?value.currency:(S.settings?.currency||'USD'),accountSize:number('accountSize'),initialBalance:number('initialBalance'),profitTarget:number('profitTarget'),maxDrawdown:number('maxDrawdown'),dailyLossLimit:number('dailyLossLimit'),status,archived:value?.archived===true,phase:['phase1','phase2','funded'].includes(value?.phase)?value.phase:'phase1',drawdownType:['static','trailing_eod','trailing_intraday'].includes(value?.drawdownType)?value.drawdownType:'static',drawdownLocksAtStart:value?.drawdownLocksAtStart===true,minTradingDays:Number.isInteger(Number(value?.minTradingDays))&&Number(value?.minTradingDays)>=0&&Number(value?.minTradingDays)<=365?Number(value.minTradingDays):0,minDayProfit:optionalRule('minDayProfit',1e12),consistencyPct:(optionalRule('consistencyPct',100)||null),profitSplitPct:optionalRule('profitSplitPct',100)});names.add(name.toLocaleLowerCase());ids.add(id);
  });
  return out;
}
function accountTypeLabel(kind){return ({personal:'Personal',prop:'Prop firm',demo:'Demo'})[kind]||'Personal';}
function accountSizeOptionLabel(account){const currency=account.currency||S.settings.currency||'USD';return account.accountSize>0?formatMoney(account.accountSize,currency):account.initialBalance>0?formatMoney(account.initialBalance,currency):'size not set';}
function updateTradeCurrencyLabel(){const id=document.getElementById('f-account')?.value,account=S.accounts.find(item=>item.id===id),label=document.querySelector('[for="f-amount"]');if(label)label.textContent=`P&L (${account?.currency||S.settings.currency||'USD'})`;}
function accountForTrade(trade){return S.accounts.find(account=>account.id===trade?.accountId||account.id===legacyAccountId(trade?.account||''))||S.accounts.find(account=>account.name.toLocaleLowerCase()===String(trade?.account||'').toLocaleLowerCase())||null;}
function tradeAccountId(trade){return String(accountForTrade(trade)?.id||trade?.accountId||legacyAccountId(trade?.account||''));}
function tradeAccountName(trade){return accountForTrade(trade)?.name||String(trade?.account||'Unassigned account');}
function activeAccounts(){return S.accounts.filter(account=>!account.archived);}
function selectedAccountId(){const id=S.settings?.activeAccountId;return activeAccounts().some(account=>account.id===id)?id:'all';}
function selectedAccount(){const id=selectedAccountId();return id==='all'?null:S.accounts.find(account=>account.id===id)||null;}
function selectedTrades(trades=S.trades){const id=selectedAccountId();return id==='all'?trades.slice():trades.filter(trade=>tradeAccountId(trade)===id);}
function accountTrades(account){return S.trades.filter(trade=>tradeAccountId(trade)===account.id);}
function accountDailyResults(account){return (S.dailyResults||[]).filter(result=>result.accountId===account.id);}
function accountResultPnl(account){const dates=new Set([...accountDailyResults(account).map(result=>result.date),...accountTrades(account).map(trade=>trade.date)]);return [...dates].reduce((sum,date)=>sum+effectiveAccountDay(account,date).pnl,0);}
function accountEquity(account){return Number(account.initialBalance||0)+accountResultPnl(account);}
function accountFees(account){return (S.settings.accountFees||[]).filter(event=>event.accountId===account.id);}
function accountPayouts(account){return (S.settings.payouts||[]).filter(event=>event.accountId===account.id);}
function accountNetResult(account){return accountPayouts(account).reduce((sum,event)=>sum+event.amount,0)-accountFees(account).reduce((sum,event)=>sum+event.amount,0);}
function accountEconomics(account){const fees=accountFees(account).reduce((sum,event)=>sum+event.amount,0),payouts=accountPayouts(account).reduce((sum,event)=>sum+event.amount,0);return {fees,payouts,net:payouts-fees,roi:fees?(payouts-fees)/fees:null,paidBack:fees>0&&payouts>=fees};}
function accountRuleRows(account){const dates=new Set([...accountDailyResults(account).map(result=>result.date),...accountTrades(account).map(trade=>trade.date)]);let equity=Number(account.initialBalance)||0;return [...dates].sort().map(date=>{const day=effectiveAccountDay(account,date);equity+=day.pnl;return {date,pnl:day.pnl,equity,source:day.source};});}
function accountRuleMetrics(account){const rows=accountRuleRows(account),start=Number(account.initialBalance)||0,current=rows.length?rows[rows.length-1].equity:start,limit=Number(account.maxDrawdown)||0,type=account.drawdownType||'static';let floor=start-limit;if(type!=='static'){const high=Math.max(start,...rows.map(row=>row.equity));floor=high-limit;if(account.drawdownLocksAtStart)floor=Math.min(start,floor);}const buffer=current-floor,used=limit?Math.max(0,limit-buffer):0,usedPct=limit?used/limit*100:0,status=buffer<=0||usedPct>=95?'breached':usedPct>=80?'close':'safe',eligible=rows.filter(row=>row.source!=='none'&&(account.minDayProfit==null||row.pnl>=Number(account.minDayProfit||0))),wins=rows.filter(row=>row.pnl>0),net=rows.reduce((sum,row)=>sum+row.pnl,0),best=Math.max(0,...wins.map(row=>row.pnl)),consistencyPct=Number(account.consistencyPct)||0,ratio=net>0?best/net*100:Infinity,requiredProfit=consistencyPct?best/(consistencyPct/100):0;return {rows,current,floor,buffer,limit,usedPct,status,eligibleDays:eligible.length,best,net,consistencyPct,ratio,requiredProfit,approximate:type==='trailing_intraday'};}
function weekTrades(){const key=weekKey(),today=todayStr();return selectedTrades().filter(t=>t.date>=key&&t.date<=today);}
function weekLabel(){const start=weekStartDate(),end=new Date(start);end.setDate(start.getDate()+6);return `${start.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;}
function tradesInMonth(y,m0){ const k=monthKey(y,m0); return selectedTrades().filter(t=>t.date.slice(0,7)===k); }
function tradesOnDay(ds){ return selectedTrades().filter(t=>t.date===ds); }
function dailyResultsOnDay(ds){const id=selectedAccountId();return (S.dailyResults||[]).filter(result=>result.date===ds&&(id==='all'||result.accountId===id));}
function dailyResultForAccount(ds,accountId){return (S.dailyResults||[]).find(result=>result.date===ds&&result.accountId===accountId)||null;}
function effectiveAccountDay(account,ds){const result=dailyResultForAccount(ds,account.id);if(result)return {pnl:Number(result.pnl)||0,source:'result',result};const trades=S.trades.filter(trade=>trade.date===ds&&tradeAccountId(trade)===account.id);return trades.length?{pnl:sumSigned(trades),source:'trades',trades}:{pnl:0,source:'none'};}
function effectiveDay(ds){const id=selectedAccountId(),accounts=id==='all'?S.accounts:S.accounts.filter(account=>account.id===id);return accounts.map(account=>({account,...effectiveAccountDay(account,ds)})).filter(item=>item.source!=='none');}
function effectiveDayPnl(ds){return effectiveDay(ds).reduce((sum,item)=>sum+item.pnl,0);}
function monthDayRows(y,m0){const key=monthKey(y,m0),dates=new Set();(S.dailyResults||[]).forEach(result=>{if(result.date.startsWith(key)&&(selectedAccountId()==='all'||result.accountId===selectedAccountId()))dates.add(result.date);});selectedTrades().forEach(trade=>{if(trade.date.startsWith(key))dates.add(trade.date);});return [...dates].sort().map(date=>({date,pnl:effectiveDayPnl(date)}));}
function visibleDayRows(){const dates=new Set(selectedTrades().map(trade=>trade.date));(S.dailyResults||[]).forEach(result=>{if(selectedAccountId()==='all'||result.accountId===selectedAccountId())dates.add(result.date);});return [...dates].sort().map(date=>({date,pnl:effectiveDayPnl(date)}));}
function summarizeDays(rows){const values=rows.map(row=>Number(row.pnl)||0),grossProfit=values.filter(value=>value>0).reduce((sum,value)=>sum+value,0),grossLoss=values.filter(value=>value<0).reduce((sum,value)=>sum+value,0),wins=values.filter(value=>value>0).length,losses=values.filter(value=>value<0).length;return {net:values.reduce((sum,value)=>sum+value,0),grossProfit,grossLoss,wins,losses,winRate:wins+losses?Math.round(wins/(wins+losses)*100):0,best:values.length?Math.max(...values):0,worst:values.length?Math.min(...values):0,days:rows.length};}
function normalizeDailyResults(values){return (Array.isArray(values)?values:[]).map(value=>({id:String(value?.id||''),accountId:String(value?.accountId||value?.account_id||''),date:String(value?.date||value?.trade_date||''),pnl:Number(value?.pnl)||0,note:typeof value?.note==='string'?value.note:''})).filter(value=>value.accountId&&/^\d{4}-\d{2}-\d{2}$/.test(value.date));}
function signed(t){ return t.result==='profit' ? Math.abs(Number(t.amount)) : -Math.abs(Number(t.amount)); }
function sumSigned(list){ return list.reduce((a,t)=>a+signed(t),0); }
function performanceStats(trades){
  const ordered=trades.slice().sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  let grossProfit=0,grossLoss=0,running=0,peak=0,maxDrawdown=0,currentWins=0,currentLosses=0,longestWins=0,longestLosses=0;
  ordered.forEach(t=>{
    const value=signed(t);
    if(value>0){grossProfit+=value;currentWins++;currentLosses=0;longestWins=Math.max(longestWins,currentWins);}
    else if(value<0){grossLoss+=Math.abs(value);currentLosses++;currentWins=0;longestLosses=Math.max(longestLosses,currentLosses);}
    else{currentWins=0;currentLosses=0;}
    running+=value;peak=Math.max(peak,running);maxDrawdown=Math.max(maxDrawdown,peak-running);
  });

async function offlineApi(path,method='GET',body){

      const trade={...body.trade,id,images};

    }
  }

function galleryItems(){

function safeExternalUrl(value){try{const url=new URL(value);return url.protocol==='https:'?url.href:'#';}catch(error){return '#';}}
function activePublicDeals(feed,firmId){
  const now=Date.now(),maxAge=72*60*60*1000;
  return (Array.isArray(feed?.offers)?feed.offers:[]).filter(offer=>{
    if(offer?.firmId!==firmId||offer.publiclyShareable!==true||!offer.verifiedAt)return false;
    const expires=offer.expiresAt?Date.parse(offer.expiresAt):Infinity,verified=Date.parse(offer.verifiedAt),starts=offer.startsAt?Date.parse(offer.startsAt):-Infinity;
    return Number.isFinite(verified)&&(offer.expiresAt==null||Number.isFinite(expires))&&(offer.startsAt==null||Number.isFinite(starts))&&expires>now&&starts<=now&&verified<=now&&now-verified<=maxAge;
  });
}

async function loadPropFirmDeals(){

class BackgroundChart{

    this.visibility=()=>{this.hidden=document.hidden;if(this.hidden)this.pause();else if(this.reduced.matches)this.draw(0);else this.start();};
    this.motion=()=>{if(this.reduced.matches){this.pause();this.draw(0);}else if(!this.hidden)this.start();};
    window.addEventListener('resize',this.resize,{passive:true});document.addEventListener('visibilitychange',this.visibility);this.reduced.addEventListener?.('change',this.motion);this.resize();
    if(this.reduced.matches)this.draw(0);else if(!this.hidden)this.start();
  }
  start(){if(this.frame||this.hidden||this.reduced.matches)return;const tick=time=>{this.frame=0;if(this.hidden||this.reduced.matches)return;this.draw(time);this.frame=requestAnimationFrame(tick);};this.frame=requestAnimationFrame(tick);}
  pause(){if(this.frame)cancelAnimationFrame(this.frame);this.frame=0;}
  draw(time){
    const ctx=this.ctx,w=this.width,h=this.height;if(!ctx||!w||!h)return;ctx.clearRect(0,0,w,h);const horizon=h*.28,base=h*.91,spacing=w<640?24:18,offset=this.reduced.matches?0:(time*.006)%spacing,step=Math.floor(time*.006/spacing),lineOffset=this.reduced.matches?0:(time*.0035)%spacing,lineStep=Math.floor(time*.0035/spacing),grid=ctx.createLinearGradient(0,horizon,0,h);grid.addColorStop(0,cssTokenRgba('--cx-muted',0));grid.addColorStop(.45,cssTokenRgba('--cx-muted',.06));grid.addColorStop(1,cssTokenRgba('--cx-muted',.15));

    const count=Math.ceil(w/spacing)+3,bodyWidth=Math.max(3,spacing*.42);ctx.save();ctx.lineCap='round';for(let i=-1;i<count;i++){const item=this.series[(i+step+this.series.length*20)%this.series.length],x=w-(i*spacing+offset),map=value=>horizon+value*(base-horizon),open=map(item.open),close=map(item.close),high=map(item.high),low=map(item.low),rise=item.close>=item.open,pulse=((Math.sin(time*.001+i*2.4)+1)/2)>.993?1.4:1;ctx.globalAlpha=(rise?this.profitAlpha:this.lossAlpha)*pulse;ctx.strokeStyle=cssTokenColor(rise?'--cx-profit':'--cx-loss');ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,high);ctx.lineTo(x,low);ctx.stroke();ctx.fillRect(x-bodyWidth/2,Math.min(open,close),bodyWidth,Math.max(2,Math.abs(close-open)));}

const animatedKpis=new WeakSet();
function animateKpis(){
  document.querySelectorAll('[data-count-up]').forEach(element=>{if(animatedKpis.has(element))return;const original=element.textContent.trim(),match=original.match(/^([^\d]*)(\d[\d,]*(?:\.\d+)?)(.*)$/);if(!match)return;animatedKpis.add(element);const prefix=match[1],target=Number(match[2].replace(/,/g,'')),suffix=match[3],decimals=(match[2].split('.')[1]||'').length;if(!Number.isFinite(target))return;
    const run=()=>{const start=performance.now(),duration=600;const step=now=>{const progress=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-progress,3),value=target*ease;const formatted=value.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});element.textContent=prefix+formatted+suffix;if(progress<1)requestAnimationFrame(step);else element.textContent=original;};requestAnimationFrame(step);};
    if('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)){observer.disconnect();run();}},{threshold:.3});observer.observe(element);}else run();
  });
}
function resetTilt(element){element.style.removeProperty('--tilt-x');element.style.removeProperty('--tilt-y');}
document.addEventListener('pointermove',event=>{
  if(event.pointerType!=='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches||matchMedia('(hover: none)').matches)return;const card=event.target.closest('[data-tilt]');if(!card)return;const box=card.getBoundingClientRect(),x=(event.clientX-box.left)/box.width,y=(event.clientY-box.top)/box.height;card.style.setProperty('--tilt-x',`${(0.5-y)*5}deg`);card.style.setProperty('--tilt-y',`${(x-0.5)*5}deg`);
},{passive:true});
document.addEventListener('pointerleave',event=>{const card=event.target.closest?.('[data-tilt]');if(card&&!card.contains(event.relatedTarget))resetTilt(card);},true);

    const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    if(offset){e.preventDefault();const date=new Date(`${e.target.dataset.date}T00:00:00`);date.setDate(date.getDate()+offset);const next=dstr(date.getFullYear(),date.getMonth(),date.getDate());if(date.getMonth()!==calMonth.getMonth()||date.getFullYear()!==calMonth.getFullYear()){calMonth=new Date(date.getFullYear(),date.getMonth(),1);render();document.querySelector(`.cal-cell[data-date="${next}"]`)?.focus();}else document.querySelector(`.cal-cell[data-date="${next}"]`)?.focus();}
  }
});
document.addEventListener('paste',async e=>{
  if(!modal||modal.mode!=='form'||!e.clipboardData)return;
  const files=[];for(const item of e.clipboardData.items){if(item.type.startsWith('image/')){const file=item.getAsFile();if(file)files.push(file);}}
  if(files.length){e.preventDefault();await addImageFiles(files);}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#uploadZone'))e.preventDefault();});
document.addEventListener('drop',async e=>{if(e.target.closest('#uploadZone')){e.preventDefault();await addImageFiles(e.dataTransfer.files);}});

const moneyTextPattern=/^\s*(?:(?:[+-]\s*)?(?:[$€£¥₹]|(?:USD|EUR|GBP|JPY|CAD|AUD|INR)\s*)\s*)?\d[\d,.]*(?:\s*(?:USD|EUR|GBP|JPY|CAD|AUD|INR))?(?:\s*[|/·]\s*(?:(?:[+-]\s*)?(?:[$€£¥₹]|(?:USD|EUR|GBP|JPY|CAD|AUD|INR)\s*)\s*)?\d[\d,.]*(?:\s*(?:USD|EUR|GBP|JPY|CAD|AUD|INR))?)*\s*$/i;
function applyMoneyNumberClass(root){if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const node=walker.currentNode,parent=node.parentElement,text=node.textContent.trim();if(parent&&!parent.children.length&&moneyTextPattern.test(text))parent.classList.add('cx-num');}}
const moneyNumberObserver=new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===Node.ELEMENT_NODE)applyMoneyNumberClass(node);else if(node.nodeType===Node.TEXT_NODE&&node.parentElement?.parentElement)applyMoneyNumberClass(node.parentElement.parentElement);} )));
['app','modalRoot','toastRoot'].forEach(id=>{const root=document.getElementById(id);if(root)moneyNumberObserver.observe(root,{childList:true,subtree:true});});

initApp();

</script>
