<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CandleX — Trading Journal</title>
<script>document.documentElement.setAttribute('data-theme','dark');</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0B1020;--surface:#121A2D;--surface2:#1A2540;--border:#2A3652;
  --text:#E9ECF5;--text-dim:#9AA6BC;--brand:#9333EA;--brand-light:#C084FC;
  --profit:#22C08C;--loss:#F0575F;
  --font:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --display:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#F5F5FA;--surface:#FFFFFF;--surface2:#F0ECF8;--border:#DDD6EA;
  --text:#1D1B27;--text-dim:#6B6678;--brand:#7E22CE;--brand-light:#9333EA;
  --profit:#0EA372;--loss:#DC3E4C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 2px;font-weight:600}
.sub{color:var(--text-dim);font-size:14px;margin:0}
.profit{color:var(--profit)}.loss{color:var(--loss)}.flat{color:var(--text-dim)}
.shell{display:flex;min-height:100%}
.sidebar{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;display:none;flex-direction:column}
.sidebar .brand{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--brand-light);margin-bottom:28px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:var(--text-dim);font-size:14px;font-family:var(--font)}
.nav-btn.active,.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{color:var(--brand-light);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.topbar .brand{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--brand-light)}
.content{padding:20px;padding-bottom:90px;max-width:920px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tab-btn{all:unset;flex:1;text-align:center;cursor:pointer;padding:10px 2px;font-size:11px;color:var(--text-dim);font-family:var(--font)}
.tab-btn.active{color:var(--brand-light);font-weight:600}
.nav-btn:focus-visible,.tab-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px}
@media(min-width:860px){.sidebar{display:flex}.topbar{display:none}.tabbar{display:none}.content{padding:32px}}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn{font-family:var(--font);border:1px solid transparent;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:500}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--text-dim);border-color:var(--border)}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:transparent;color:var(--loss);border-color:var(--loss)}
.icon-btn{all:unset;cursor:pointer;color:var(--text-dim);padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.hero-label{color:var(--text-dim);font-size:14px;margin-bottom:6px}
.hero-value{font-family:var(--mono);font-size:40px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:10px;padding:14px 16px}
.tile-label{color:var(--text-dim);font-size:13px;margin-bottom:4px}
.tile-value{font-family:var(--mono);font-size:22px;font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px}
.empty-body{color:var(--text-dim);font-size:14px;margin:0 auto 16px;max-width:360px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-weight:600;font-family:var(--mono)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;color:var(--text-dim);font-size:12px;padding:4px 0}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.cal-cell:hover{border-color:var(--brand-light)}
.cal-cell.is-today{border-color:var(--brand);border-width:2px}
.cal-cell.cal-empty{border:none;cursor:default;background:transparent}
.cal-daynum{font-size:12px;color:var(--text-dim)}
.cal-pl{font-family:var(--mono);font-size:11px;font-weight:600;margin-top:auto;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-count{font-size:10px;color:var(--text-dim)}
.hint{color:var(--text-dim);font-size:13px;margin-top:14px;text-align:center}
.day-group{margin-bottom:18px}
.day-group-head{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.trade-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;flex-wrap:wrap}
.trade-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.trade-instr{font-weight:500;font-size:14px}
.trade-notes{color:var(--text-dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.trade-side{display:flex;align-items:center;gap:6px}
.trade-amt{font-family:var(--mono);font-weight:600;font-size:14px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
.badge-long{background:rgba(34,192,140,.15);color:var(--profit)}
.badge-short{background:rgba(240,87,95,.15);color:var(--loss)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.chart-wrap{height:260px;margin-top:10px}
.field-label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px}
.field-label:first-child{margin-top:0}
.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font);font-size:14px}
textarea.input{resize:vertical}
.mono-area{font-family:var(--mono);font-size:12px}
.seg{display:flex;gap:8px}
.seg-btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;color:var(--text-dim);user-select:none;text-align:center;flex:1;background:transparent}
.seg-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
input[type=radio]{position:absolute;opacity:0;pointer-events:none}
input[type=radio]:checked + .seg-btn{background:var(--brand);border-color:var(--brand);color:#fff}
input#res-profit:checked + .seg-btn{background:var(--profit);border-color:var(--profit);color:#06281d}
input#res-loss:checked + .seg-btn{background:var(--loss);border-color:var(--loss);color:#2b0a0d}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,10,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:16px;max-height:85vh}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface)}
.modal-title{font-weight:600;font-size:16px}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 2px}
.toast-root{position:fixed;bottom:20px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateY(0)}
.toast-err{border-color:var(--loss);color:var(--loss)}
.topbar{justify-content:space-between}
.topbar-tools{display:flex;align-items:center;gap:12px}
.account-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:13px}
.account-bar .user-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.sidebar-footer{margin-top:auto;padding-top:24px;display:grid;gap:12px}
.discord-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-dim);font-size:13px;text-decoration:none}
.discord-link:hover{color:var(--brand-light)}
.discord-link svg{width:19px;height:19px;fill:currentColor}
.sidebar{flex-direction:column}
.auth-only .sidebar,.auth-only .tabbar,.auth-only .account-bar{display:none!important}
.auth-only .content{max-width:480px;min-height:100vh;display:flex;align-items:center;padding:24px}
.auth-card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px}
.auth-brand{font:600 22px var(--mono);color:var(--brand-light);margin-bottom:20px}
.auth-card h1{margin-bottom:6px}
.auth-card .auth-intro{margin-bottom:20px}
.auth-switch{color:var(--text-dim);font-size:13px;margin:16px 0 0;text-align:center}
.auth-switch button,.text-button{border:0;background:none;padding:0;color:var(--brand-light);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.auth-error{color:var(--loss);font-size:13px;margin-top:10px;min-height:18px}
.auth-success{color:var(--profit);font-size:13px;margin-top:10px;min-height:18px}
.auth-setup{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0 0 18px;padding:12px;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:8px;background:var(--surface2)}
.full-btn{width:100%;margin-top:16px}
.field-help{color:var(--text-dim);font-size:12px;margin:6px 0 0}
.inline-field{display:flex;align-items:center;gap:8px}
.inline-field .input{min-width:0}
.account-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.account-chip,.tag-chip,.emotion-chip{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:6px 10px;font-size:12px}
.account-chip{display:inline-flex;align-items:center;gap:8px}
.account-chip button,.tag-chip button{all:unset;cursor:pointer;color:var(--text-dim);font-size:15px;line-height:1}
.tag-entry{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.tag-entry input{flex:1;min-width:130px;border:0;outline:0;background:transparent;color:var(--text);font:14px var(--font);padding:4px}
#tagList{display:contents}
.tag-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px}
.emotion-list{display:flex;flex-wrap:wrap;gap:7px}
.emotion-chip{cursor:pointer;padding:7px 10px;color:var(--text-dim)}
.emotion-chip[aria-pressed="true"]{background:rgba(147,51,234,.22);border-color:var(--brand);color:var(--brand-light)}
.upload-zone{display:grid;place-items:center;gap:6px;text-align:center;border:1px dashed var(--border);border-radius:10px;padding:18px 12px;background:var(--surface2);color:var(--text-dim);font-size:13px}
.upload-zone strong{color:var(--text)}
.image-previews,.detail-images{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.image-preview{width:92px;height:82px;position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface2)}
.image-preview img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.image-preview .remove-image{position:absolute;top:3px;right:3px;background:rgba(8,12,24,.82);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.trade-open{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.trade-open:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px;border-radius:5px}
.row-thumbs{display:flex;align-items:center;gap:4px}
.row-thumb{width:30px;height:30px;border:1px solid var(--border);border-radius:5px;padding:0;overflow:hidden;background:var(--surface2);cursor:zoom-in}
.row-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.trade-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--text-dim);font-size:12px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detail-value{font-size:14px;overflow-wrap:anywhere}
.detail-label{font-size:11px;color:var(--text-dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.note-block{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.note-block p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.image-backdrop{position:fixed;inset:0;background:rgba(3,6,15,.92);z-index:80;display:grid;place-items:center;padding:18px}
.image-viewer{max-width:min(1100px,96vw);max-height:92vh;position:relative}
.image-viewer img{display:block;max-width:100%;max-height:86vh;object-fit:contain;border-radius:8px}
.image-viewer .image-caption{color:#fff;text-align:center;font-size:13px;padding:8px}
.image-viewer .image-close{position:absolute;right:0;top:-38px;color:#fff;font-size:24px}
.modal{max-width:680px}
.discord-auth{margin-top:18px;justify-content:center;width:100%}
.site-footer{padding:12px 20px 24px;display:flex;justify-content:center}
@media(max-width:520px){.account-bar{padding:8px 12px}.account-bar .user-email{max-width:150px}.content{padding:16px 12px 90px}.modal-body{padding:14px}.modal-foot{padding:12px 14px}.detail-grid{grid-template-columns:1fr 1fr}.trade-row{padding:9px}.trade-side{gap:2px}.trade-amt{font-size:13px}}
@media(max-width:380px){.detail-grid{grid-template-columns:1fr}.modal-foot .btn{padding:9px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* CandleX dimensional finish: layered surfaces, ambient light, and restrained depth. */
:root{
  --bg:#080D1B;--surface:#10182C;--surface2:#17223B;--border:rgba(160,177,215,.17);
  --text:#F0F2FA;--text-dim:#A2AEC5;--brand:#9B4DFF;--brand-light:#D3A7FF;
  --depth-shadow:0 22px 55px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.22);
}
:root[data-theme="light"]{
  --bg:#F1F0F8;--surface:#FBFAFF;--surface2:#F0EDF8;--border:rgba(74,56,111,.14);
  --text:#211B30;--text-dim:#716A83;--brand:#812BDE;--brand-light:#7424C9;
  --depth-shadow:0 20px 46px rgba(59,40,94,.12),0 3px 10px rgba(59,40,94,.07);
}
html{background:var(--bg)}
body{
  background:
    radial-gradient(ellipse at 76% 2%,rgba(118,50,210,.18),transparent 33rem),
    radial-gradient(ellipse at 8% 44%,rgba(39,102,177,.10),transparent 30rem),var(--bg);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.12;
  background-image:linear-gradient(rgba(182,197,231,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(182,197,231,.14) 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 82%);
}
:root[data-theme="light"] body::before{opacity:.2;background-image:linear-gradient(rgba(94,70,145,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(94,70,145,.09) 1px,transparent 1px)}
.shell{min-height:100svh;position:relative}
.sidebar{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(180deg,rgba(18,27,49,.97),rgba(11,17,33,.98));
  border-right-color:rgba(174,145,235,.14);box-shadow:12px 0 38px rgba(0,0,0,.14)
}
.sidebar::before{content:"";position:absolute;z-index:-1;left:-105px;top:85px;width:260px;height:260px;border-radius:50%;background:rgba(127,54,225,.14);filter:blur(70px);pointer-events:none}
:root[data-theme="light"] .sidebar{background:linear-gradient(180deg,#F7F4FF,#EBE8F4);box-shadow:10px 0 34px rgba(50,35,82,.08)}
.sidebar .brand{letter-spacing:-.055em;text-shadow:0 0 26px rgba(179,110,255,.35)}
.nav-btn{transition:transform .22s ease,background .22s ease,color .22s ease,box-shadow .22s ease}
.nav-btn:hover{transform:translateX(3px)}
.nav-btn.active{background:linear-gradient(105deg,rgba(151,75,255,.2),rgba(151,75,255,.055));box-shadow:inset 2px 0 0 var(--brand-light),inset 0 1px rgba(255,255,255,.07)}
.main{position:relative;min-height:100svh}
.topbar,.account-bar{background:rgba(13,20,37,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:rgba(166,181,218,.13)}
:root[data-theme="light"] .topbar,:root[data-theme="light"] .account-bar{background:rgba(250,248,255,.78);border-color:rgba(74,56,111,.11)}
.topbar{position:sticky;top:0;z-index:18}
.topbar .brand{letter-spacing:-.055em;text-shadow:0 0 25px rgba(179,110,255,.3)}
.content{max-width:1180px;padding-top:34px;padding-bottom:58px}
.page-head{align-items:center;margin-bottom:24px}
h1{font-family:var(--display);font-size:clamp(24px,3vw,32px);letter-spacing:-.04em;font-weight:600;text-shadow:0 2px 24px rgba(138,97,207,.15)}
.sub{line-height:1.55}
.btn{border-radius:10px;font-weight:600;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease,border-color .2s ease}
.btn-primary{background:linear-gradient(135deg,#B05DFF 0%,#842FF0 52%,#6924D0 100%);box-shadow:0 8px 22px rgba(126,42,217,.3),inset 0 1px rgba(255,255,255,.3),inset 0 -2px rgba(38,8,82,.18)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 13px 28px rgba(126,42,217,.39),inset 0 1px rgba(255,255,255,.34)}
.btn-secondary,.btn-ghost{box-shadow:inset 0 1px rgba(255,255,255,.045),0 3px 9px rgba(0,0,0,.1)}
.btn-secondary:hover,.btn-ghost:hover{transform:translateY(-1px);border-color:rgba(193,150,255,.4)}
.hero-card{
  position:relative;isolation:isolate;overflow:hidden;min-height:206px;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(116deg,#171C39 0%,#26204C 51%,#271645 100%);
  border:1px solid rgba(208,177,255,.23);border-radius:20px;padding:30px 34px;margin-bottom:20px;
  box-shadow:0 28px 68px rgba(31,13,68,.36),inset 0 1px rgba(255,255,255,.17),inset 0 -1px rgba(0,0,0,.24);
  transform-style:preserve-3d;transition:transform .35s ease,box-shadow .35s ease
}
.hero-card::before{
  content:"";position:absolute;z-index:-1;right:-25px;top:50%;width:330px;height:250px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(169,94,255,.33),rgba(113,54,200,.14) 48%,transparent 71%);
  transform:translateY(-50%) rotate(-18deg);filter:blur(3px)
}
.hero-card::after{
  content:"";position:absolute;z-index:-1;right:12%;top:50%;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 29% 23%,#F1DFFF 0 1.8%,#D4A5FF 4%,#9A4BEA 22%,#5D2AAF 54%,#27164D 75%,rgba(24,13,48,.2) 77%,transparent 79%);
  box-shadow:inset -12px -14px 24px rgba(10,6,33,.62),inset 5px 5px 13px rgba(255,255,255,.42),0 18px 35px rgba(7,5,27,.47),0 0 38px rgba(171,103,255,.32);

function pad(n){ return n<10 ? '0'+n : ''+n; }
function dstr(y,m0,d){ return y+'-'+pad(m0+1)+'-'+pad(d); }
function monthKey(y,m0){ return y+'-'+pad(m0+1); }
function todayStr(){ const t=new Date(); return dstr(t.getFullYear(),t.getMonth(),t.getDate()); }
function weekStartDate(date=new Date()){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function weekKey(date=new Date()){const d=weekStartDate(date);return dstr(d.getFullYear(),d.getMonth(),d.getDate());}
function weekTrades(){const key=weekKey(),today=todayStr();return S.trades.filter(t=>t.date>=key&&t.date<=today);}
function weekLabel(){const start=weekStartDate(),end=new Date(start);end.setDate(start.getDate()+6);return `${start.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;}
function tradesInMonth(y,m0){ const k=monthKey(y,m0); return S.trades.filter(t=>t.date.slice(0,7)===k); }
function tradesOnDay(ds){ return S.trades.filter(t=>t.date===ds); }
function signed(t){ return t.result==='profit' ? Math.abs(Number(t.amount)) : -Math.abs(Number(t.amount)); }
function sumSigned(list){ return list.reduce((a,t)=>a+signed(t),0); }
function plClass(n){ return n>0 ? 'profit' : n<0 ? 'loss' : 'flat'; }
function fmtMoney(n){
  const cur=(S.settings&&S.settings.currency)||'USD';
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur,maximumFractionDigits:2}).format(n);}
  catch(e){return (n<0?'-':'')+cur+' '+Math.abs(n).toFixed(2);}
}
function fmtSigned(n){ if(Math.abs(n)<0.005)return fmtMoney(0); return (n>0?'+':'')+fmtMoney(n); }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function buildCalendarDays(y,m0){
  const startWeekday=new Date(y,m0,1).getDay(), daysInMonth=new Date(y,m0+1,0).getDate(), cells=[];
  for(let i=0;i<startWeekday;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  return cells;
}

const OFFLINE_DB='candlex-offline-v1';
let OFFLINE_LOCAL_STORAGE=false;
function emptyOfflineState(){return {trades:[],settings:defaultSettings(),accounts:[]};}
function openOfflineDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open(OFFLINE_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('journal');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(new Error('IndexedDB unavailable'));});}
async function readOfflineState(){
  try{const db=await openOfflineDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('journal','readonly'),req=tx.objectStore('journal').get('state');req.onsuccess=()=>resolve(req.result||emptyOfflineState());req.onerror=()=>reject(new Error('Could not read local journal'));tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(new Error('Could not read local journal'));};});}
  catch(error){OFFLINE_LOCAL_STORAGE=true;try{return JSON.parse(localStorage.getItem(OFFLINE_DB)||'null')||emptyOfflineState();}catch(e){throw new Error('This browser blocks local storage for this file. Try opening it in Chrome or Edge and allow browser storage.');}}
}
async function writeOfflineState(state){
  if(OFFLINE_LOCAL_STORAGE){try{localStorage.setItem(OFFLINE_DB,JSON.stringify(state));return;}catch(e){throw new Error('Browser storage is full or blocked. Remove large screenshots or use a browser that allows local storage.');}}
  try{const db=await openOfflineDb();await new Promise((resolve,reject)=>{const tx=db.transaction('journal','readwrite');tx.objectStore('journal').put(state,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(new Error('Could not save local journal'));});db.close();}
  catch(error){OFFLINE_LOCAL_STORAGE=true;try{localStorage.setItem(OFFLINE_DB,JSON.stringify(state));}catch(e){throw new Error('Browser storage is full or blocked. Remove large screenshots or use a browser that allows local storage.');}}
}
async function offlineApi(path,method='GET',body){
  const route=new URL(path,location.href).pathname;
  if(route==='/api/session')return {user:{email:'Offline journal · this browser'}};
  const state=await readOfflineState();
  if(route==='/api/data')return state;
  if(route==='/api/settings'&&method==='PUT'){state.settings=body.settings||state.settings;state.accounts=body.accounts||state.accounts;await writeOfflineState(state);return {settings:state.settings,accounts:state.accounts};}
  if(route==='/api/trades'&&method==='POST'){
    const id=uid(),added=(body.images||[]).map(i=>({id:uid(),name:i.name,type:i.type,url:i.data}));
    const trade={...body.trade,id,images:added};state.trades.push(trade);await writeOfflineState(state);return {trade};
  }
  const match=route.match(/^\/api\/trades\/([^/]+)$/);
  if(match){const id=decodeURIComponent(match[1]),idx=state.trades.findIndex(t=>t.id===id);
    if(method==='DELETE'){if(idx>=0)state.trades.splice(idx,1);await writeOfflineState(state);return {};}
    if(method==='PUT'){
      const old=idx>=0?state.trades[idx]:null;if(!old)throw new Error('Trade not found.');
      const keep=new Set(body.keepImageIds||[]),images=(old.images||[]).filter(i=>keep.has(i.id));
      for(const i of body.images||[])images.push({id:uid(),name:i.name,type:i.type,url:i.data});
      const trade={...body.trade,id,images};state.trades[idx]=trade;await writeOfflineState(state);return {trade};
    }
  }
  if(route.startsWith('/api/auth/'))return {user:{email:'Offline journal · this browser'}};
  throw new Error('This feature is not available in the offline file.');
}
async function api(path,method='GET',body){
  if(window.CandleXHosted?.enabled&&!forceOfflineMode)return window.CandleXHosted.api(path,method,body);
  return offlineApi(path,method,body);
}

async function saveGoals(form){

  if(!Number.isFinite(dailyLossLimit)||dailyLossLimit<0||dailyLossLimit>1e9||!Number.isFinite(weeklyProfitTarget)||weeklyProfitTarget<0||weeklyProfitTarget>1e9||!Number.isInteger(weeklyTradeTarget)||weeklyTradeTarget<0||weeklyTradeTarget>10000){toast('Enter valid non-negative goals within the shown limits.',true);return;}

async function saveWeeklyReview(form){

function openDay(date){modal={mode:'day',date};render();}
function openForm(date,trade,origin){

function closeModal(){
  if(modal&&modal.mode==='image'){modal=modal.returnModal||null;render();return;}
  modal=null;render();
}

  else if(modal&&modal.origin==='detail'){
    const t=S.trades.find(x=>x.id===modal.trade.id);

async function handleTradeFormSubmit(form){
  const submit=form.querySelector('[type=submit]');
  const trade={
    date:form.querySelector('#f-date').value,
    instrument:form.querySelector('#f-instrument').value.trim(),
    dir:form.querySelector('input[name=dir]:checked').value,
    result:form.querySelector('input[name=result]:checked').value,
    amount:Math.abs(parseFloat(form.querySelector('#f-amount').value)),
    account:form.querySelector('#f-account').value,
    tags:[...form.querySelectorAll('#tagList [data-chip]')].map(x=>x.dataset.tag),
    emotions:[...form.querySelectorAll('.emotion-chip[aria-pressed="true"]')].map(x=>x.dataset.emotion),
    marketConditions:form.querySelector('#f-market').value.trim(),
    rationale:form.querySelector('#f-rationale').value.trim(),
    lessons:form.querySelector('#f-lessons').value.trim(),
    notes:modal.trade?.notes||''
  };
  if(!trade.date||!trade.instrument||!trade.account||!Number.isFinite(trade.amount)||trade.amount<=0){toast('Complete the required trade fields.',true);return;}
  const body={trade,images:modal.newImages.map(({name,type,data})=>({name,type,data})),keepImageIds:modal.keptImageIds};
  submit.disabled=true;submit.textContent='Saving…';
  try{
    const old=modal.trade;
    const result=old?await api('/api/trades/'+encodeURIComponent(old.id),'PUT',body):await api('/api/trades','POST',body);
    const saved=result.trade;
    if(old){S.trades=S.trades.map(t=>t.id===old.id?saved:t);}
    else S.trades.push(saved);
    toast(old?'Trade updated.':'Trade saved.');
    backFromForm();
  }catch(e){submit.disabled=false;submit.textContent='Save trade';toast(e.message,true);}
}
async function deleteTrade(id){
  if(!confirm('Delete this trade and its screenshots? This cannot be undone.'))return;
  try{
    await api('/api/trades/'+encodeURIComponent(id),'DELETE');
    S.trades=S.trades.filter(t=>t.id!==id);
    modal=null;render();toast('Trade deleted.');
  }catch(e){toast(e.message,true);}
}

function csvEsc(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  const header=['Date','Instrument','Direction','Result','Amount','Trading account','Tags','Emotions','Market conditions','Trade rationale','Lessons learned','Screenshots'];
  const rows=S.trades.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.instrument,t.dir,t.result,t.amount,t.account,(t.tags||[]).join('; '),(t.emotions||[]).join('; '),t.marketConditions||t.notes||'',t.rationale||'',t.lessons||'',(t.images||[]).length]);
  return [header,...rows].map(r=>r.map(csvEsc).join(',')).join('\r\n');
}
function exportCsv(){
  if(!S.trades.length){toast('No trades to export yet.');return;}
  const blob=new Blob([buildCsv()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='candlex-trades.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV exported.');
}

function dailyLossAmount(){return S.trades.filter(t=>t.date===todayStr()).reduce((sum,t)=>sum+Math.max(0,-signed(t)),0);}

function riskResultHtml(){
  const balance=Number(riskDraft.balance),riskPercent=Number(riskDraft.riskPercent),entry=Number(riskDraft.entry),stop=Number(riskDraft.stop),target=Number(riskDraft.target),pointValue=Number(riskDraft.pointValue);
  const hasBudget=Number.isFinite(balance)&&balance>0&&Number.isFinite(riskPercent)&&riskPercent>0&&riskPercent<=100;
  const budget=hasBudget?balance*riskPercent/100:0,limit=Number(S.settings.goals?.dailyLossLimit)||0,todayLoss=dailyLossAmount(),remaining=limit>0?Math.max(0,limit-todayLoss):null;
  const allowed=limit>0?Math.min(budget,remaining):budget,distance=Math.abs(entry-stop),correctStop=riskDraft.direction==='long'?stop<entry:stop>entry;
  const validPrices=Number.isFinite(entry)&&entry>0&&Number.isFinite(stop)&&stop>0&&distance>0&&correctStop&&Number.isFinite(pointValue)&&pointValue>0;
  const perUnit=validPrices?distance*pointValue:0,units=hasBudget&&validPrices&&perUnit>0?allowed/perUnit:null;
  const validTarget=Number.isFinite(target)&&target>0&&(riskDraft.direction==='long'?target>entry:target<entry),reward=units!==null&&validTarget?units*Math.abs(target-entry)*pointValue:null,rr=validPrices&&validTarget?Math.abs(target-entry)/distance:null;
  const wrongStop=entry>0&&stop>0&&distance>0&&!correctStop;
  let message='Enter account balance, entry, and stop prices to calculate an estimated position size.';
  if(limit>0&&remaining<=0)message=`Daily loss limit reached: ${fmtMoney(todayLoss)} realized loss today against a ${fmtMoney(limit)} limit. Pause and review before taking another trade.`;
  else if(limit>0&&budget>remaining)message=`Daily limit leaves ${fmtMoney(remaining)} of room today, so the calculator caps risk below your ${riskPercent||0}% balance setting.`;
  else if(wrongStop)message=`For a ${riskDraft.direction} trade, place the stop on the opposite side of entry.`;
  else if(Number.isFinite(riskPercent)&&riskPercent>100)message='Risk per trade must be 100% or less.';
  else if(rr===null&&riskDraft.target)message=`For a ${riskDraft.direction} trade, enter the target beyond entry in the trade direction.`;
  else if(hasBudget&&validPrices)message='Sizing is an estimate. Check your broker’s contract, pip, and minimum-lot rules before placing an order.';
  const alertClass=(limit>0&&remaining<=0)||wrongStop?'risk-alert':'risk-note';
  return `<div class="risk-output" aria-live="polite">
    <div class="risk-metric"><div class="risk-metric-label">Max risk for trade</div><div class="risk-metric-value">${hasBudget?fmtMoney(allowed):'—'}</div></div>
    <div class="risk-metric"><div class="risk-metric-label">Estimated position</div><div class="risk-metric-value">${units===null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:3}).format(units)} units</div></div>
    <div class="risk-metric"><div class="risk-metric-label">Target reward</div><div class="risk-metric-value">${reward===null?'—':fmtMoney(reward)}</div></div>
    <div class="risk-metric"><div class="risk-metric-label">Risk / reward</div><div class="risk-metric-value">${rr===null?'—':`1 : ${rr.toFixed(2)}`}</div></div>
  </div><div class="${alertClass}" role="status">${esc(message)}</div>`;
}

  const existing=(modal.trade?.images||[]).filter(i=>modal.keptImageIds.includes(i.id)).map(i=>({id:i.id,name:i.name,url:i.url,persisted:true}));
  const pending=modal.newImages.map(i=>({id:i.id,name:i.name,url:i.data,persisted:false}));
  holder.innerHTML=[...existing,...pending].map(i=>`<div class="image-preview"><img src="${esc(i.url)}" alt="${esc(i.name)}" data-action="preview-image" data-id="${esc(i.id)}"><button type="button" class="remove-image" data-action="remove-image" data-id="${esc(i.id)}" aria-label="Remove ${esc(i.name)}">×</button></div>`).join('');
}
function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('That image could not be read.'));reader.readAsDataURL(file);});}
async function addImageFiles(fileList){
  if(!modal||modal.mode!=='form')return;
  const supported=['image/jpeg','image/png','image/webp','image/gif'];
  for(const file of Array.from(fileList||[])){
    if(modal.keptImageIds.length+modal.newImages.length>=5){toast('A trade can have up to 5 screenshots.',true);break;}
    if(!supported.includes(file.type)){toast('Use a JPG, PNG, WebP, or GIF screenshot.',true);continue;}
    if(file.size>5*1024*1024){toast('Each screenshot must be 5 MB or smaller.',true);continue;}
    try{const data=await readImage(file);if(!modal||modal.mode!=='form')return;modal.newImages.push({id:uid(),name:file.name,type:file.type,data});renderImagePreviews();}
    catch(e){toast(e.message,true);}
  }
}
function addTag(value){
  const tag=value.trim().replace(/\s+/g,' ');if(!tag)return;
  if(tag.length>40){toast('Tags can be up to 40 characters.',true);return;}
  const holder=document.getElementById('tagList');if(!holder)return;
  const existing=[...holder.querySelectorAll('[data-chip]')].map(x=>x.dataset.tag.toLowerCase());
  if(existing.includes(tag.toLowerCase()))return;
  if(existing.length>=30){toast('A trade can have up to 30 tags.',true);return;}
  holder.insertAdjacentHTML('beforeend',tagChipHtml(tag));
}
async function addAccount(name,selectInForm){
  const account=name.trim();if(!account){toast('Enter an account name.',true);return;}
  if(account.length>80){toast('Trading account names can be up to 80 characters.',true);return;}
  if(S.accounts.some(a=>a.toLowerCase()===account.toLowerCase())){toast('That trading account already exists.',true);return;}
  S.accounts.push(account);
  try{
    await persistSettings();
    if(selectInForm){const select=document.getElementById('f-account');if(select){const option=document.createElement('option');option.value=account;option.textContent=account;select.appendChild(option);select.value=account;}const field=document.getElementById('f-new-account');if(field)field.value='';}
    else render();
    toast('Trading account added.');
  }catch(e){S.accounts=S.accounts.filter(a=>a!==account);toast(e.message,true);}
}

async function handleAuthSubmit(form){
  if(HOSTED_AUTH_UNCONFIGURED&&!forceOfflineMode){authError='Hosted account setup is not complete yet.';render();return;}
  authError='';authMessage='';const mode=authMode,data=Object.fromEntries(new FormData(form).entries());
  try{
    const result=await api(mode==='register'?'/api/auth/register':'/api/auth/login','POST',data);
    if(mode==='register'&&result.pendingConfirmation){authMode='login';authMessage='Check your email and confirm your account, then sign in.';render();return;}
    if(!result.user)throw new Error('CandleX did not return an account. Please try again.');
    user=result.user;await loadUserData();view='dashboard';modal=null;authMode='login';render();toast(mode==='register'?'Account created.':'Signed in.');
  }catch(e){authError=e.message;render();document.getElementById('authEmail')?.focus();}
}
async function signOut(){
  try{await api('/api/auth/logout','POST',{});}catch(e){}
  user=null;S={trades:[],settings:defaultSettings(),accounts:[]};modal=null;authMode='login';authError='';authMessage='';render();
}
function showImage(image,returnModal){modal={mode:'image',image,returnModal};render();}

document.addEventListener('click',async e=>{
  const backdrop=e.target.closest('.modal-backdrop,.image-backdrop');
  if(backdrop&&!e.target.closest('[data-stop]')){closeModal();return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  if((el.classList.contains('modal-backdrop')||el.classList.contains('image-backdrop'))&&e.target.closest('[data-stop]'))return;
  const a=el.dataset.action;
  if(a==='nav'){view=el.dataset.view;modal=null;render();}
  else if(a==='auth-mode'){authMode=authMode==='login'?'register':'login';authError='';authMessage='';render();}
  else if(a==='offline-mode'){forceOfflineMode=true;user={email:'Offline journal · this browser'};await loadUserData();render();}
  else if(a==='sign-out'){await signOut();}
  else if(a==='add-trade'){openForm(todayStr(),null,'direct');}
  else if(a==='add-trade-day'){openForm(el.dataset.date,null,'day');}
  else if(a==='open-day'){openDay(el.dataset.date);}
  else if(a==='detail-trade'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t){modal={mode:'detail',trade:t};render();}}
  else if(a==='edit-trade'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t)openForm(t.date,t,(modal&&modal.mode==='day')?'day':'direct');}
  else if(a==='edit-detail'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t)openForm(t.date,t,'detail');}
  else if(a==='delete-trade'){await deleteTrade(el.dataset.id);}
  else if(a==='close-modal'){closeModal();}
  else if(a==='close-image'){closeModal();}
  else if(a==='cancel-form'){backFromForm();}
  else if(a==='cal-prev'){calMonth.setMonth(calMonth.getMonth()-1);render();}
  else if(a==='cal-next'){calMonth.setMonth(calMonth.getMonth()+1);render();}
  else if(a==='set-theme'){const prior=S.settings.theme;S.settings.theme=el.dataset.theme;applyTheme();try{await persistSettings();render();}catch(err){S.settings.theme=prior;applyTheme();toast(err.message,true);}}
  else if(a==='export-csv'){exportCsv();}
  else if(a==='copy-csv'){navigator.clipboard.writeText(modal.text).then(()=>toast('Copied to clipboard.')).catch(()=>toast('Could not copy — select the text and copy manually.',true));}
  else if(a==='toggle-emotion'){const pressed=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',String(!pressed));}
  else if(a==='remove-tag'){el.closest('[data-chip]')?.remove();}
  else if(a==='add-account-form'){await addAccount(document.getElementById('f-new-account')?.value||'',true);}
  else if(a==='remove-account'){
    const index=Number(el.dataset.index),old=S.accounts[index];if(old===undefined)return;
    S.accounts.splice(index,1);try{await persistSettings();render();toast('Trading account removed.');}catch(err){S.accounts.splice(index,0,old);toast(err.message,true);}
  }
  else if(a==='remove-image'){
    if(!modal||modal.mode!=='form')return;
    const id=el.dataset.id;modal.keptImageIds=modal.keptImageIds.filter(x=>x!==id);modal.newImages=modal.newImages.filter(x=>x.id!==id);renderImagePreviews();
  }
  else if(a==='preview-image'){
    const id=el.dataset.id;
    const existing=(modal.trade?.images||[]).find(i=>i.id===id);
    const image=existing||modal.newImages.find(i=>i.id===id);
    if(image)showImage(image,modal);
  }
  else if(a==='open-image'){
    const t=S.trades.find(x=>x.id===el.dataset.tradeId),image=t?.images?.find(i=>i.id===el.dataset.id);
    if(t&&image){const returnModal=modal||{mode:'detail',trade:t};showImage(image,returnModal);}
  }
});

document.addEventListener('change',async e=>{
  if(e.target.id==='riskDirection'){
    riskDraft.direction=e.target.value;const holder=document.getElementById('riskResult');if(holder)holder.innerHTML=riskResultHtml();
  }else if(e.target.id==='currencySelect'){
    const old=S.settings.currency;S.settings.currency=e.target.value;try{await persistSettings();render();}catch(err){S.settings.currency=old;toast(err.message,true);}
  }else if(e.target.id==='screenshotInput'){
    await addImageFiles(e.target.files);e.target.value='';
  }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='authForm'){e.preventDefault();await handleAuthSubmit(e.target);}
  else if(e.target.id==='tradeForm'){e.preventDefault();await handleTradeFormSubmit(e.target);}
  else if(e.target.id==='accountForm'){e.preventDefault();await addAccount(document.getElementById('accountName').value,false);}
  else if(e.target.id==='goalsForm'){e.preventDefault();await saveGoals(e.target);}
  else if(e.target.id==='weeklyReviewForm'){e.preventDefault();await saveWeeklyReview(e.target);}
});
document.addEventListener('input',e=>{
  const map={riskBalance:'balance',riskPercent:'riskPercent',riskEntry:'entry',riskStop:'stop',riskTarget:'target',riskPointValue:'pointValue'};
  const field=map[e.target.id];if(!field)return;
  riskDraft[field]=e.target.value;const holder=document.getElementById('riskResult');if(holder)holder.innerHTML=riskResultHtml();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='tagInput'){e.preventDefault();addTag(e.target.value);e.target.value='';}
  if(e.key==='Escape'&&modal){closeModal();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cal-cell[data-action="open-day"]')){e.preventDefault();openDay(e.target.dataset.date);}
});
document.addEventListener('paste',async e=>{
  if(!modal||modal.mode!=='form'||!e.clipboardData)return;
  const files=[];for(const item of e.clipboardData.items){if(item.type.startsWith('image/')){const file=item.getAsFile();if(file)files.push(file);}}
  if(files.length){e.preventDefault();await addImageFiles(files);}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#uploadZone'))e.preventDefault();});
document.addEventListener('drop',async e=>{if(e.target.closest('#uploadZone')){e.preventDefault();await addImageFiles(e.dataTransfer.files);}});

initApp();

</script>
</body>
</html>
