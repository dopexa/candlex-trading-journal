<style>
*{box-sizing:border-box}
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0B1020;--surface:#121A2D;--surface2:#1A2540;--border:#2A3652;
  --text:#E9ECF5;--text-dim:#9AA6BC;--brand:#9333EA;--brand-light:#C084FC;
  --profit:#22C08C;--loss:#F0575F;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --display:'Manrope','Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#F5F5FA;--surface:#FFFFFF;--surface2:#F0ECF8;--border:#DDD6EA;
  --text:#1D1B27;--text-dim:#6B6678;--brand:#7E22CE;--brand-light:#9333EA;
  --profit:#0EA372;--loss:#DC3E4C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 2px;font-weight:600}
.sub{color:var(--text-dim);font-size:14px;margin:0}
.profit{color:var(--profit)}.loss{color:var(--loss)}.flat{color:var(--text-dim)}
.shell{display:flex;min-height:100%}
.sidebar{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;display:none;flex-direction:column}
.sidebar .brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--brand-light);margin-bottom:28px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:var(--text-dim);font-size:14px;font-family:var(--font)}
.nav-btn.active,.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{color:var(--brand-light);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.topbar .brand{font-family:var(--display);font-weight:700;font-size:18px;color:var(--brand-light)}
.content{padding:20px;padding-bottom:90px;max-width:920px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tab-btn{all:unset;flex:1;text-align:center;cursor:pointer;padding:10px 2px;font-size:11px;color:var(--text-dim);font-family:var(--font)}
.tab-btn.active{color:var(--brand-light);font-weight:600}
.nav-btn:focus-visible,.tab-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px}
@media(min-width:860px){.sidebar{display:flex}.topbar{display:none}.tabbar{display:none}.content{padding:32px}}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.btn{font-family:var(--font);border:1px solid transparent;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:500}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn-ghost{background:transparent;color:var(--text-dim);border-color:var(--border)}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:transparent;color:var(--loss);border-color:var(--loss)}
.icon-btn{all:unset;cursor:pointer;color:var(--text-dim);padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.hero-label{color:var(--text-dim);font-size:14px;margin-bottom:6px}
.hero-value{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:10px;padding:14px 16px}
.tile-label{color:var(--text-dim);font-size:13px;margin-bottom:4px}
.tile-value{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px}
.empty-body{color:var(--text-dim);font-size:14px;margin:0 auto 16px;max-width:360px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-weight:700;font-family:var(--display)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;color:var(--text-dim);font-size:12px;padding:4px 0}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.cal-cell:hover{border-color:var(--brand-light)}
.cal-cell.is-today{border-color:var(--brand);border-width:2px}
.cal-cell.cal-empty{border:none;cursor:default;background:transparent}
.cal-daynum{font-size:12px;color:var(--text-dim)}
.cal-pl{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;margin-top:auto;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-count{font-size:10px;color:var(--text-dim)}
.hint{color:var(--text-dim);font-size:13px;margin-top:14px;text-align:center}
.day-group{margin-bottom:18px}
.day-group-head{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.trade-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;flex-wrap:wrap}
.trade-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.trade-instr{font-weight:500;font-size:14px}
.trade-notes{color:var(--text-dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.trade-side{display:flex;align-items:center;gap:6px}
.trade-amt{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
.badge-long{background:rgba(34,192,140,.15);color:var(--profit)}
.badge-short{background:rgba(240,87,95,.15);color:var(--loss)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.chart-wrap{height:260px;margin-top:10px}
.field-label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px}
.field-label:first-child{margin-top:0}
.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font);font-size:14px}
textarea.input{resize:vertical}
.mono-area{font-family:var(--mono);font-size:12px}
.seg{display:flex;gap:8px}
.seg-btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;color:var(--text-dim);user-select:none;text-align:center;flex:1;background:transparent}
.seg-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
input[type=radio]{position:absolute;opacity:0;pointer-events:none}
input[type=radio]:checked + .seg-btn{background:var(--brand);border-color:var(--brand);color:#fff}
input#res-profit:checked + .seg-btn{background:var(--profit);border-color:var(--profit);color:#06281d}
input#res-loss:checked + .seg-btn{background:var(--loss);border-color:var(--loss);color:#2b0a0d}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,10,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:16px;max-height:85vh}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface)}
.modal-title{font-weight:600;font-size:16px}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 2px}
.toast-root{position:fixed;bottom:20px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateY(0)}
.toast-err{border-color:var(--loss);color:var(--loss)}
.topbar{justify-content:space-between}
.topbar-tools{display:flex;align-items:center;gap:12px}
.account-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:13px}
.account-bar .user-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.sidebar-footer{margin-top:auto;padding-top:24px;display:grid;gap:12px}
.discord-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-dim);font-size:13px;text-decoration:none}
.discord-link:hover{color:var(--brand-light)}
.discord-link svg{width:19px;height:19px;fill:currentColor}
.sidebar{flex-direction:column}
.auth-only .sidebar,.auth-only .tabbar,.auth-only .account-bar{display:none!important}
.auth-only .content{max-width:480px;min-height:100vh;display:flex;align-items:center;padding:24px}
.auth-card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px}
.auth-brand{font:700 22px var(--display);color:var(--brand-light);margin-bottom:20px}
.auth-card h1{margin-bottom:6px}
.auth-card .auth-intro{margin-bottom:20px}
.auth-switch{color:var(--text-dim);font-size:13px;margin:16px 0 0;text-align:center}
.auth-switch button,.text-button{border:0;background:none;padding:0;color:var(--brand-light);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.auth-error{color:var(--loss);font-size:13px;margin-top:10px;min-height:18px}
.auth-success{color:var(--profit);font-size:13px;margin-top:10px;min-height:18px}
.auth-setup{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0 0 18px;padding:12px;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:8px;background:var(--surface2)}
.full-btn{width:100%;margin-top:16px}
.field-help{color:var(--text-dim);font-size:12px;margin:6px 0 0}
.inline-field{display:flex;align-items:center;gap:8px}
.inline-field .input{min-width:0}
.account-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.account-chip,.tag-chip,.emotion-chip{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:6px 10px;font-size:12px}
.account-chip{display:inline-flex;align-items:center;gap:8px}
.account-chip button,.tag-chip button{all:unset;cursor:pointer;color:var(--text-dim);font-size:15px;line-height:1}
.tag-entry{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.tag-entry input{flex:1;min-width:130px;border:0;outline:0;background:transparent;color:var(--text);font:14px var(--font);padding:4px}
#tagList{display:contents}
.tag-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px}
.emotion-list{display:flex;flex-wrap:wrap;gap:7px}
.emotion-chip{cursor:pointer;padding:7px 10px;color:var(--text-dim)}
.emotion-chip[aria-pressed="true"]{background:rgba(147,51,234,.22);border-color:var(--brand);color:var(--brand-light)}
.upload-zone{display:grid;place-items:center;gap:6px;text-align:center;border:1px dashed var(--border);border-radius:10px;padding:18px 12px;background:var(--surface2);color:var(--text-dim);font-size:13px}
.upload-zone strong{color:var(--text)}
.image-previews,.detail-images{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.image-preview{width:92px;height:82px;position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface2)}
.image-preview img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.image-preview .remove-image{position:absolute;top:3px;right:3px;background:rgba(8,12,24,.82);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.trade-open{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.trade-open:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px;border-radius:5px}
.row-thumbs{display:flex;align-items:center;gap:4px}
.row-thumb{width:30px;height:30px;border:1px solid var(--border);border-radius:5px;padding:0;overflow:hidden;background:var(--surface2);cursor:zoom-in}
.row-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.trade-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--text-dim);font-size:12px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detail-value{font-size:14px;overflow-wrap:anywhere}
.detail-label{font-size:11px;color:var(--text-dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.note-block{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.note-block p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.image-backdrop{position:fixed;inset:0;background:rgba(3,6,15,.92);z-index:80;display:grid;place-items:center;padding:18px}
.image-viewer{max-width:min(1100px,96vw);max-height:92vh;position:relative}
.image-viewer img{display:block;max-width:100%;max-height:86vh;object-fit:contain;border-radius:8px}
.image-viewer .image-caption{color:#fff;text-align:center;font-size:13px;padding:8px}
.image-viewer .image-close{position:absolute;right:0;top:-38px;color:#fff;font-size:24px}
.modal{max-width:680px}
.discord-auth{margin-top:18px;justify-content:center;width:100%}
.site-footer{padding:12px 20px 24px;display:flex;justify-content:center}
@media(max-width:520px){.account-bar{padding:8px 12px}.account-bar .user-email{max-width:150px}.content{padding:16px 12px 90px}.modal-body{padding:14px}.modal-foot{padding:12px 14px}.detail-grid{grid-template-columns:1fr 1fr}.trade-row{padding:9px}.trade-side{gap:2px}.trade-amt{font-size:13px}}
@media(max-width:380px){.detail-grid{grid-template-columns:1fr}.modal-foot .btn{padding:9px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* CandleX dimensional finish: layered surfaces, ambient light, and restrained depth. */
:root{
  --bg:#080D1B;--surface:#10182C;--surface2:#17223B;--border:rgba(160,177,215,.17);
  --text:#F0F2FA;--text-dim:#A2AEC5;--brand:#9B4DFF;--brand-light:#D3A7FF;
  --depth-shadow:0 22px 55px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.22);
}
:root[data-theme="light"]{
  --bg:#F1F0F8;--surface:#FBFAFF;--surface2:#F0EDF8;--border:rgba(74,56,111,.14);
  --text:#211B30;--text-dim:#716A83;--brand:#812BDE;--brand-light:#7424C9;
  --depth-shadow:0 20px 46px rgba(59,40,94,.12),0 3px 10px rgba(59,40,94,.07);
}
html{background:var(--bg)}
body{
  background:
    radial-gradient(ellipse at 76% 2%,rgba(118,50,210,.18),transparent 33rem),
    radial-gradient(ellipse at 8% 44%,rgba(39,102,177,.10),transparent 30rem),var(--bg);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.12;
  background-image:linear-gradient(rgba(182,197,231,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(182,197,231,.14) 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 82%);
}
:root[data-theme="light"] body::before{opacity:.2;background-image:linear-gradient(rgba(94,70,145,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(94,70,145,.09) 1px,transparent 1px)}
.shell{min-height:100svh;position:relative}
.sidebar{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(180deg,rgba(18,27,49,.97),rgba(11,17,33,.98));
  border-right-color:rgba(174,145,235,.14);box-shadow:12px 0 38px rgba(0,0,0,.14)
}
.sidebar::before{content:"";position:absolute;z-index:-1;left:-105px;top:85px;width:260px;height:260px;border-radius:50%;background:rgba(127,54,225,.14);filter:blur(70px);pointer-events:none}
:root[data-theme="light"] .sidebar{background:linear-gradient(180deg,#F7F4FF,#EBE8F4);box-shadow:10px 0 34px rgba(50,35,82,.08)}
.sidebar .brand{letter-spacing:-.055em;text-shadow:0 0 26px rgba(179,110,255,.35)}
.nav-btn{transition:transform .22s ease,background .22s ease,color .22s ease,box-shadow .22s ease}
.nav-btn:hover{transform:translateX(3px)}
.nav-btn.active{background:linear-gradient(105deg,rgba(151,75,255,.2),rgba(151,75,255,.055));box-shadow:inset 2px 0 0 var(--brand-light),inset 0 1px rgba(255,255,255,.07)}
.main{position:relative;min-height:100svh}
.topbar,.account-bar{background:rgba(13,20,37,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:rgba(166,181,218,.13)}
:root[data-theme="light"] .topbar,:root[data-theme="light"] .account-bar{background:rgba(250,248,255,.78);border-color:rgba(74,56,111,.11)}
.topbar{position:sticky;top:0;z-index:18}
.topbar .brand{letter-spacing:-.055em;text-shadow:0 0 25px rgba(179,110,255,.3)}
.content{max-width:1180px;padding-top:34px;padding-bottom:58px}
.page-head{align-items:center;margin-bottom:24px}
h1{font-family:var(--display);font-size:clamp(24px,3vw,32px);letter-spacing:-.04em;font-weight:600;text-shadow:0 2px 24px rgba(138,97,207,.15)}
.sub{line-height:1.55}
.btn{border-radius:10px;font-weight:600;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease,border-color .2s ease}
.btn-primary{background:linear-gradient(135deg,#B05DFF 0%,#842FF0 52%,#6924D0 100%);box-shadow:0 8px 22px rgba(126,42,217,.3),inset 0 1px rgba(255,255,255,.3),inset 0 -2px rgba(38,8,82,.18)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 13px 28px rgba(126,42,217,.39),inset 0 1px rgba(255,255,255,.34)}
.btn-secondary,.btn-ghost{box-shadow:inset 0 1px rgba(255,255,255,.045),0 3px 9px rgba(0,0,0,.1)}
.btn-secondary:hover,.btn-ghost:hover{transform:translateY(-1px);border-color:rgba(193,150,255,.4)}
.hero-card{
  position:relative;isolation:isolate;overflow:hidden;min-height:206px;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(116deg,#171C39 0%,#26204C 51%,#271645 100%);
  border:1px solid rgba(208,177,255,.23);border-radius:20px;padding:30px 34px;margin-bottom:20px;
  box-shadow:0 28px 68px rgba(31,13,68,.36),inset 0 1px rgba(255,255,255,.17),inset 0 -1px rgba(0,0,0,.24);
  transform-style:preserve-3d;transition:transform .35s ease,box-shadow .35s ease
}
.hero-card::before{
  content:"";position:absolute;z-index:-1;right:-25px;top:50%;width:330px;height:250px;border-radius:50%;

/* 3D risk and review tools */

/* Account switching and balance cards */
.account-bar{flex-wrap:wrap;gap:10px;min-height:56px}
.account-picker{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 11px;border:1px solid rgba(169,145,209,.2);border-radius:12px;background:rgba(28,34,54,.58)}
.account-picker>span{color:var(--text-dim)}
:root[data-theme="light"] .account-picker{border-color:rgba(91,69,133,.14);background:rgba(255,255,255,.78)}
:root[data-theme="light"] .account-picker .input{background:rgba(74,56,111,.045)}
.account-picker>span,.account-card-stats span,.account-meta-form label>span,.account-create-form label>span,.trade-account-fields label>span{color:var(--text-dim);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.account-picker .input{width:min(260px,34vw);min-height:36px;padding:7px 31px 7px 10px;border-color:transparent;background:rgba(255,255,255,.045);font-size:12px}
.account-create-link{border:1px solid rgba(177,136,238,.3);border-radius:10px;background:rgba(130,76,201,.12);color:var(--brand-light);padding:9px 12px;font:600 12px var(--font);cursor:pointer}
.account-create-link:hover{background:rgba(130,76,201,.2);border-color:rgba(177,136,238,.5)}
.account-manager{display:grid;gap:14px}
.account-manager>.tool-sub{margin-top:-8px;max-width:680px}
.account-create-form{display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(140px,.8fr) minmax(170px,1fr) auto;align-items:end;gap:10px;padding:14px;border:1px solid rgba(169,145,209,.17);border-radius:13px;background:rgba(10,15,29,.34)}
.account-create-form label,.account-meta-form label,.trade-account-fields label{display:grid;gap:6px;min-width:0}
.account-create-form .input,.account-meta-form .input,.trade-account-fields .input{min-width:0;min-height:39px}
.account-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:11px;margin-top:0}
.account-card{min-width:0;padding:15px;border:1px solid rgba(169,145,209,.17);border-radius:14px;background:linear-gradient(145deg,rgba(30,38,62,.58),rgba(17,24,42,.68));box-shadow:inset 0 1px rgba(255,255,255,.045)}
:root[data-theme="light"] .account-card{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(243,239,250,.92))}
.account-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.account-kind{display:inline-flex;padding:4px 7px;border:1px solid rgba(178,139,236,.22);border-radius:999px;background:rgba(130,76,201,.12);color:var(--brand-light);font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.account-card h3{margin:7px 0 0;font:700 15px var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.account-card-pnl{display:grid;justify-items:end;font:700 15px var(--mono);white-space:nowrap}
.account-card-pnl span{margin-top:3px;color:var(--text-dim);font:700 8px var(--font);letter-spacing:.1em;text-transform:uppercase}
.account-card-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0;padding:11px 0;border-top:1px solid rgba(169,181,218,.11);border-bottom:1px solid rgba(169,181,218,.11)}
.account-card-stats>div{display:grid;gap:5px;min-width:0}
.account-card-stats span{font-size:8px;letter-spacing:.09em}
.account-card-stats strong{font:700 12px var(--mono);overflow-wrap:anywhere}
.account-meta-form{display:grid;grid-template-columns:minmax(130px,1.2fr) minmax(112px,.7fr) minmax(135px,1fr) auto;align-items:end;gap:8px}
.account-meta-form label>span,.account-create-form label>span,.trade-account-fields label>span{font-size:8px;letter-spacing:.08em}
.account-meta-form .input{font-size:11px}
.account-card-foot{display:flex;justify-content:flex-end;min-height:20px;margin-top:8px}
.account-card-foot .field-help{margin:0}
.account-card-foot .text-button{font-size:11px;text-decoration:none}
.trade-account-create{margin:9px 0 13px;padding:10px 11px;border:1px solid rgba(169,145,209,.17);border-radius:11px;background:rgba(23,30,49,.45)}
:root[data-theme="light"] .trade-account-create{background:rgba(243,239,250,.7)}
.trade-account-create summary{color:var(--brand-light);font-size:12px;font-weight:700;cursor:pointer;list-style:none}
.trade-account-create summary::-webkit-details-marker{display:none}
.trade-account-create summary::after{content:"+";float:right;color:var(--text-dim);font-size:15px}
.trade-account-create[open] summary::after{content:"−"}
.trade-account-fields{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(110px,.8fr) minmax(135px,1fr) auto;align-items:end;gap:8px;margin-top:11px}

/* Calendar summary, daily result markers, and gentle month transitions */
.cal-nav{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;min-height:76px;padding:10px 14px}
.cal-arrow{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(169,145,209,.2);border-radius:11px;background:rgba(255,255,255,.035);color:var(--text);font:400 25px/1 var(--font);cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.cal-arrow:hover{transform:translateY(-2px);border-color:var(--brand-light);background:rgba(153,79,245,.12)}
.cal-month{display:grid;gap:4px;justify-items:center;font-size:15px;letter-spacing:-.01em}
.cal-month strong{font:700 16px var(--display)}
.cal-month span{color:var(--text-dim);font:600 10px var(--font);letter-spacing:.015em}
.cal-month span i{padding:0 4px;color:var(--brand-light);font-style:normal}
.cal-month span b{font:700 10px var(--mono)}
.cal-grid{gap:8px;perspective:1200px}
.cal-cell{min-width:0;aspect-ratio:auto;min-height:88px;transform-origin:center;backface-visibility:hidden}
.cal-cell-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cal-daynum{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;font-size:11px}
.cal-cell.is-today .cal-daynum{background:rgba(157,94,239,.22);color:var(--brand-light);box-shadow:0 0 15px rgba(151,86,235,.16)}
.cal-cell.has-trades::after{position:absolute;inset:auto 7px 7px;height:2px;border-radius:99px;content:"";opacity:.72}
.cal-cell.has-trades.is-profit{border-color:rgba(55,203,151,.24);background:linear-gradient(145deg,rgba(24,69,64,.58),rgba(15,31,43,.94))}
.cal-cell.has-trades.is-profit::after{background:linear-gradient(90deg,transparent,rgba(67,218,163,.8),transparent)}
.cal-cell.has-trades.is-loss{border-color:rgba(244,103,113,.23);background:linear-gradient(145deg,rgba(67,36,53,.58),rgba(28,24,42,.94))}
.cal-cell.has-trades.is-loss::after{background:linear-gradient(90deg,transparent,rgba(255,111,122,.78),transparent)}
.cal-cell.has-trades.is-flat{border-color:rgba(158,177,215,.25)}
:root[data-theme="light"] .cal-cell.has-trades.is-profit{background:linear-gradient(145deg,#E7F8F0,#F7FBF9)}
:root[data-theme="light"] .cal-cell.has-trades.is-loss{background:linear-gradient(145deg,#FDECEE,#FCF8FA)}
.cal-trade-dots{display:flex;gap:3px}
.cal-trade-dots i{width:5px;height:5px;border-radius:50%;background:var(--text-dim)}
.cal-trade-dots i.is-win{background:var(--profit);box-shadow:0 0 6px rgba(34,192,140,.4)}
.cal-trade-dots i.is-loss{background:var(--loss);box-shadow:0 0 6px rgba(240,87,95,.35)}
.cal-pl{font-size:12px}
.cal-count{font-size:9px}
@keyframes calendar-grid-in{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes calendar-cell-in{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:no-preference){.cal-grid{animation:calendar-grid-in .28s ease both}.cal-cell:not(.cal-empty){animation:calendar-cell-in .36s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--cal-index,0)*9ms)}}
@media(max-width:900px){.account-create-form{grid-template-columns:repeat(2,minmax(0,1fr))}.account-meta-form{grid-template-columns:1fr 1fr}.account-meta-form button{justify-self:start}.trade-account-fields{grid-template-columns:1fr 1fr}.trade-account-fields button{justify-self:start}}
@media(max-width:520px){.account-bar{min-height:0;gap:7px}.account-bar .user-email{order:0;flex:1;max-width:none;font-size:10px}.account-bar>.btn{order:1}.account-picker,.account-create-link{order:2;flex:1 1 100%}.account-picker{justify-content:space-between}.account-picker .input{width:100%;max-width:none}.account-create-form{grid-template-columns:1fr}.account-create-form .btn{justify-self:start}.account-card-stats{gap:5px}.account-card-stats strong{font-size:10px}.account-meta-form{grid-template-columns:1fr 1fr}.account-meta-form label:first-child{grid-column:1/-1}.cal-grid{gap:5px}.cal-cell{min-height:72px;padding:5px;border-radius:8px}.cal-nav{min-height:68px}.cal-month strong{font-size:14px}.cal-pl{font-size:9px}.cal-count{font-size:8px}.cal-arrow{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){.cal-grid,.cal-cell,.cal-arrow{animation:none!important;transition:none!important}.cal-cell:not(.cal-empty):hover,.cal-arrow:hover{transform:none!important}}

/* Calm instrument palette and compact account calendar */
:root{--bg:#0E1217;--surface:#151B23;--surface2:#1C2430;--border:#263041;--text:#E6EAF0;--text-dim:#8A96A8;--brand:#E8B64C;--brand-light:#E8B64C;--profit:#2FBF8F;--loss:#E5584F;--font:'Inter','Noto Sans Georgian',system-ui,-apple-system,sans-serif;--display:'Manrope','Noto Sans Georgian',system-ui,sans-serif}
:root[data-theme="light"]{--bg:#F5F6F7;--surface:#FFFFFF;--surface2:#EEF1F4;--border:#D5DCE4;--text:#202832;--text-dim:#697786;--brand:#9C741B;--brand-light:#9C741B;--profit:#168B65;--loss:#C44239}
body::before{display:none!important}
.content{max-width:1280px}
.sidebar{background:var(--surface);border-color:var(--border);box-shadow:none}
.sidebar .brand,.topbar .brand{color:var(--text);letter-spacing:-.04em}
.nav-btn.active,.nav-btn:hover,.tab-btn.active{color:var(--brand-light)}

<script>
// CandleX client: Supabase is the source of truth when hosted auth is configured;
// the standalone file keeps its existing private, browser-local offline journal.
const DEFAULT_GOALS={weeklyProfitTarget:0,weeklyTradeTarget:0,dailyLossLimit:0};
function defaultSettings(){return {currency:'USD',theme:'dark',activeAccountId:'all',backgroundAnimation:true,goals:{...DEFAULT_GOALS},weeklyReviews:{}};}
function normalizeSettings(value){const next=Object.assign(defaultSettings(),value||{});next.activeAccountId=typeof value?.activeAccountId==='string'?value.activeAccountId:'all';next.backgroundAnimation=value?.backgroundAnimation!==false;next.goals=Object.assign({...DEFAULT_GOALS},value?.goals||{});next.weeklyReviews=value?.weeklyReviews&&typeof value.weeklyReviews==='object'&&!Array.isArray(value.weeklyReviews)?value.weeklyReviews:{};return next;}
let S = { trades: [], settings: defaultSettings(), accounts: [], dailyResults: [] };
let user = null;

const EMOTIONS = ['Confident','Anxious','Excited','Fearful','Calm','Frustrated','Euphoric','Regretful','Focused','Impulsive'];

function pad(n){ return n<10 ? '0'+n : ''+n; }
function dstr(y,m0,d){ return y+'-'+pad(m0+1)+'-'+pad(d); }
function monthKey(y,m0){ return y+'-'+pad(m0+1); }
function todayStr(){ const t=new Date(); return dstr(t.getFullYear(),t.getMonth(),t.getDate()); }
function weekStartDate(date=new Date()){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function weekKey(date=new Date()){const d=weekStartDate(date);return dstr(d.getFullYear(),d.getMonth(),d.getDate());}
function legacyAccountId(name){let hash=2166136261;for(const ch of String(name).toLocaleLowerCase()){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619);}return 'legacy-'+(hash>>>0).toString(36);}
function normalizeAccounts(values,trades=[]){
  const names=new Set(),ids=new Set(),out=[];
  const source=Array.isArray(values)?values.slice():[];
  const existingNames=new Set(source.map(value=>typeof value==='string'?value.trim():String(value?.name||'').trim()).filter(Boolean).map(name=>name.toLocaleLowerCase()));
  trades.forEach(trade=>{const name=String(trade?.account||'').trim();if(name&&!existingNames.has(name.toLocaleLowerCase())){existingNames.add(name.toLocaleLowerCase());source.push(name);}});
  source.forEach(value=>{
    const legacy=typeof value==='string',name=String(legacy?value:value?.name||'').trim();
    if(!name||name.length>80||names.has(name.toLocaleLowerCase()))return;
    let id=legacy?legacyAccountId(name):String(value?.id||legacyAccountId(name));
    if(!/^[a-zA-Z0-9_-]{1,80}$/.test(id)||ids.has(id))id=legacyAccountId(name);
    if(ids.has(id))return;
    const kind=['personal','prop','demo'].includes(value?.kind)?value.kind:'personal';
    const number=(field)=>{const raw=legacy?0:Number(value?.[field]||0);return Number.isFinite(raw)&&raw>=0&&raw<=1e12?raw:0;};
    const status=['active','passed','funded','failed','closed'].includes(value?.status)?value.status:'active';
    const firm=typeof value?.firm==='string'?value.firm.trim().slice(0,120):'';
    out.push({id,name,kind,firm,accountSize:number('accountSize'),initialBalance:number('initialBalance'),profitTarget:number('profitTarget'),maxDrawdown:number('maxDrawdown'),dailyLossLimit:number('dailyLossLimit'),status,archived:value?.archived===true});names.add(name.toLocaleLowerCase());ids.add(id);
  });
  return out;
}
function accountTypeLabel(kind){return ({personal:'Personal',prop:'Prop firm',demo:'Demo'})[kind]||'Personal';}
function accountSizeOptionLabel(account){return account.accountSize>0?fmtMoney(account.accountSize):account.initialBalance>0?fmtMoney(account.initialBalance):'size not set';}
function accountForTrade(trade){return S.accounts.find(account=>account.id===trade?.accountId||account.id===legacyAccountId(trade?.account||''))||S.accounts.find(account=>account.name.toLocaleLowerCase()===String(trade?.account||'').toLocaleLowerCase())||null;}
function tradeAccountId(trade){return String(accountForTrade(trade)?.id||trade?.accountId||legacyAccountId(trade?.account||''));}
function tradeAccountName(trade){return accountForTrade(trade)?.name||String(trade?.account||'Unassigned account');}
function activeAccounts(){return S.accounts.filter(account=>!account.archived);}
function selectedAccountId(){const id=S.settings?.activeAccountId;return activeAccounts().some(account=>account.id===id)?id:'all';}
function selectedAccount(){const id=selectedAccountId();return id==='all'?null:S.accounts.find(account=>account.id===id)||null;}
function selectedTrades(trades=S.trades){const id=selectedAccountId();return id==='all'?trades.slice():trades.filter(trade=>tradeAccountId(trade)===id);}
function accountTrades(account){return S.trades.filter(trade=>tradeAccountId(trade)===account.id);}
function accountDailyResults(account){return (S.dailyResults||[]).filter(result=>result.accountId===account.id);}
function accountResultPnl(account){const dates=new Set([...accountDailyResults(account).map(result=>result.date),...accountTrades(account).map(trade=>trade.date)]);return [...dates].reduce((sum,date)=>sum+effectiveAccountDay(account,date).pnl,0);}
function accountEquity(account){return Number(account.initialBalance||0)+accountResultPnl(account);}
function weekTrades(){const key=weekKey(),today=todayStr();return selectedTrades().filter(t=>t.date>=key&&t.date<=today);}
function weekLabel(){const start=weekStartDate(),end=new Date(start);end.setDate(start.getDate()+6);return `${start.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;}
function tradesInMonth(y,m0){ const k=monthKey(y,m0); return selectedTrades().filter(t=>t.date.slice(0,7)===k); }
function tradesOnDay(ds){ return selectedTrades().filter(t=>t.date===ds); }
function dailyResultsOnDay(ds){const id=selectedAccountId();return (S.dailyResults||[]).filter(result=>result.date===ds&&(id==='all'||result.accountId===id));}
function dailyResultForAccount(ds,accountId){return (S.dailyResults||[]).find(result=>result.date===ds&&result.accountId===accountId)||null;}
function effectiveAccountDay(account,ds){const result=dailyResultForAccount(ds,account.id);if(result)return {pnl:Number(result.pnl)||0,source:'result',result};const trades=S.trades.filter(trade=>trade.date===ds&&tradeAccountId(trade)===account.id);return trades.length?{pnl:sumSigned(trades),source:'trades',trades}:{pnl:0,source:'none'};}
function effectiveDay(ds){const id=selectedAccountId(),accounts=id==='all'?S.accounts:S.accounts.filter(account=>account.id===id);return accounts.map(account=>({account,...effectiveAccountDay(account,ds)})).filter(item=>item.source!=='none');}
function effectiveDayPnl(ds){return effectiveDay(ds).reduce((sum,item)=>sum+item.pnl,0);}
function monthDayRows(y,m0){const key=monthKey(y,m0),dates=new Set();(S.dailyResults||[]).forEach(result=>{if(result.date.startsWith(key)&&(selectedAccountId()==='all'||result.accountId===selectedAccountId()))dates.add(result.date);});selectedTrades().forEach(trade=>{if(trade.date.startsWith(key))dates.add(trade.date);});return [...dates].sort().map(date=>({date,pnl:effectiveDayPnl(date)}));}
function visibleDayRows(){const dates=new Set(selectedTrades().map(trade=>trade.date));(S.dailyResults||[]).forEach(result=>{if(selectedAccountId()==='all'||result.accountId===selectedAccountId())dates.add(result.date);});return [...dates].sort().map(date=>({date,pnl:effectiveDayPnl(date)}));}
function summarizeDays(rows){const values=rows.map(row=>Number(row.pnl)||0),grossProfit=values.filter(value=>value>0).reduce((sum,value)=>sum+value,0),grossLoss=values.filter(value=>value<0).reduce((sum,value)=>sum+value,0),wins=values.filter(value=>value>0).length,losses=values.filter(value=>value<0).length;return {net:values.reduce((sum,value)=>sum+value,0),grossProfit,grossLoss,wins,losses,winRate:wins+losses?Math.round(wins/(wins+losses)*100):0,best:values.length?Math.max(...values):0,worst:values.length?Math.min(...values):0,days:rows.length};}
function normalizeDailyResults(values){return (Array.isArray(values)?values:[]).map(value=>({id:String(value?.id||''),accountId:String(value?.accountId||value?.account_id||''),date:String(value?.date||value?.trade_date||''),pnl:Number(value?.pnl)||0,note:typeof value?.note==='string'?value.note:''})).filter(value=>value.accountId&&/^\d{4}-\d{2}-\d{2}$/.test(value.date));}
function signed(t){ return t.result==='profit' ? Math.abs(Number(t.amount)) : -Math.abs(Number(t.amount)); }
function sumSigned(list){ return list.reduce((a,t)=>a+signed(t),0); }
function performanceStats(trades){
  const ordered=trades.slice().sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  let grossProfit=0,grossLoss=0,running=0,peak=0,maxDrawdown=0,currentWins=0,currentLosses=0,longestWins=0,longestLosses=0;
  ordered.forEach(t=>{
    const value=signed(t);
    if(value>0){grossProfit+=value;currentWins++;currentLosses=0;longestWins=Math.max(longestWins,currentWins);}
    else if(value<0){grossLoss+=Math.abs(value);currentLosses++;currentWins=0;longestLosses=Math.max(longestLosses,currentLosses);}
    else{currentWins=0;currentLosses=0;}
    running+=value;peak=Math.max(peak,running);maxDrawdown=Math.max(maxDrawdown,peak-running);
  });
  return {expectancy:trades.length?sumSigned(trades)/trades.length:null,profitFactor:grossLoss>0?(grossProfit/grossLoss).toFixed(2):(grossProfit>0?'∞':'—'),maxDrawdown,longestWins,longestLosses};
}
function plClass(n){ return n>0 ? 'profit' : n<0 ? 'loss' : 'flat'; }
function fmtMoney(n){
  const cur=(S.settings&&S.settings.currency)||'USD';
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur,maximumFractionDigits:2}).format(n);}
  catch(e){return (n<0?'-':'')+cur+' '+Math.abs(n).toFixed(2);}
}
function fmtSigned(n){ if(Math.abs(n)<0.005)return fmtMoney(0); return (n>0?'+':'')+fmtMoney(n); }
function fmtSignedShort(n){if(Math.abs(n)<0.005)return fmtMoney(0);const cur=(S.settings&&S.settings.currency)||'USD';try{return (n>0?'+':'')+new Intl.NumberFormat('en-US',{style:'currency',currency:cur,notation:'compact',maximumFractionDigits:1}).format(n);}catch(error){return fmtSigned(n);}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function buildCalendarWeeks(y,m0){
  const startWeekday=(new Date(y,m0,1).getDay()+6)%7,daysInMonth=new Date(y,m0+1,0).getDate(),cells=[];
  for(let i=0;i<startWeekday;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7)cells.push(null);
  const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));return weeks;
}

const OFFLINE_DB='candlex-offline-v1';
let OFFLINE_LOCAL_STORAGE=false;
function emptyOfflineState(){return {trades:[],settings:defaultSettings(),accounts:[],dailyResults:[]};}
function openOfflineDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open(OFFLINE_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('journal');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(new Error('IndexedDB unavailable'));});}
async function readOfflineState(){
  try{const db=await openOfflineDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('journal','readonly'),req=tx.objectStore('journal').get('state');req.onsuccess=()=>resolve(req.result||emptyOfflineState());req.onerror=()=>reject(new Error('Could not read local journal'));tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(new Error('Could not read local journal'));};});}
  catch(error){OFFLINE_LOCAL_STORAGE=true;try{return JSON.parse(localStorage.getItem(OFFLINE_DB)||'null')||emptyOfflineState();}catch(e){throw new Error('This browser blocks local storage for this file. Try opening it in Chrome or Edge and allow browser storage.');}}
}
async function writeOfflineState(state){

async function offlineApi(path,method='GET',body){
  const route=new URL(path,location.href).pathname;
  if(route==='/api/session')return {user:{email:'Offline journal · this browser'}};
  const state=await readOfflineState();
  if(route==='/api/data')return {...state,dailyResults:state.dailyResults||[]};
  if(route==='/api/settings'&&method==='PUT'){state.settings=body.settings||state.settings;state.accounts=body.accounts||state.accounts;await writeOfflineState(state);return {settings:state.settings,accounts:state.accounts};}
  if(route==='/api/daily-results'&&method==='POST'){
    const accountId=String(body?.accountId||''),date=String(body?.date||''),pnl=Number(body?.pnl),note=String(body?.note||'');
    if(!state.accounts.some(account=>String(account?.id||'')===accountId)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(pnl)||Math.abs(pnl)>999999999999.99||note.length>2000)throw new Error('Enter a valid daily result.');
    state.dailyResults=state.dailyResults||[];const prior=state.dailyResults.find(result=>result.accountId===accountId&&result.date===date),saved={id:prior?.id||uid(),accountId,date,pnl,note:note.trim()};
    if(prior)Object.assign(prior,saved);else state.dailyResults.push(saved);await writeOfflineState(state);return {dailyResult:saved};
  }
  if(route==='/api/trades'&&method==='POST'){
    const id=uid(),added=(body.images||[]).map(i=>({id:uid(),name:i.name,type:i.type,url:i.data}));
    const trade={...body.trade,id,images:added};state.trades.push(trade);await writeOfflineState(state);return {trade};
  }
  const match=route.match(/^\/api\/trades\/([^/]+)$/);
  if(match){const id=decodeURIComponent(match[1]),idx=state.trades.findIndex(t=>t.id===id);
    if(method==='DELETE'){if(idx>=0)state.trades.splice(idx,1);await writeOfflineState(state);return {};}
    if(method==='PUT'){
      const old=idx>=0?state.trades[idx]:null;if(!old)throw new Error('Trade not found.');
      const keep=new Set(body.keepImageIds||[]),images=(old.images||[]).filter(i=>keep.has(i.id));
      for(const i of body.images||[])images.push({id:uid(),name:i.name,type:i.type,url:i.data});
      const trade={...body.trade,id,images};
      for(const field of ['marketConditions','rationale','lessons','notes'])if(Object.prototype.hasOwnProperty.call(old,field))trade[field]=old[field];
      state.trades[idx]=trade;await writeOfflineState(state);return {trade};
    }
  }
  if(route.startsWith('/api/auth/'))return {user:{email:'Offline journal · this browser'}};
  throw new Error('This feature is not available in the offline file.');
}
async function api(path,method='GET',body){

}

async function handleTradeFormSubmit(form){
  const submit=form.querySelector('[type=submit]');

  const trade={
    date:form.querySelector('#f-date').value,

    if(mode==='register'&&result.pendingConfirmation){authMode='login';authMessage='Check your email and confirm your account, then sign in.';render();return;}
    if(!result.user)throw new Error('CandleX did not return an account. Please try again.');
    user=result.user;await loadUserData();view='dashboard';modal=null;authMode='login';render();toast(mode==='register'?'Account created.':'Signed in.');
  }catch(e){authError=e.message;render();document.getElementById('authEmail')?.focus();}
}
async function signOut(){
  try{await api('/api/auth/logout','POST',{});}catch(e){}
  user=null;S={trades:[],settings:defaultSettings(),accounts:[],dailyResults:[]};modal=null;authMode='login';authError='';authMessage='';render();
}
function showImage(image,returnModal){modal={mode:'image',image,returnModal};render();}

document.addEventListener('click',async e=>{
  const backdrop=e.target.closest('.modal-backdrop,.image-backdrop');
  if(backdrop&&!e.target.closest('[data-stop]')){closeModal();return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  if((el.classList.contains('modal-backdrop')||el.classList.contains('image-backdrop'))&&e.target.closest('[data-stop]'))return;
  const a=el.dataset.action;
  if(a==='command-jump-month'&&e.target.closest('#commandMonth'))return;
  if(a==='nav'){if(el.tagName==='A')e.preventDefault();view=el.dataset.view;modal=null;render();}
  else if(a==='mobile-more'){modal={mode:'more'};render();document.querySelector('.mobile-more-sheet button')?.focus();}
  else if(a==='toggle-sidebar'){setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));}
  else if(a==='auth-mode'){authMode=authMode==='login'?'register':'login';authError='';authMessage='';render();}
  else if(a==='offline-mode'){forceOfflineMode=true;user={email:'Offline journal · this browser'};await loadUserData();render();}
  else if(a==='sign-out'){await signOut();}
  else if(a==='add-trade'){openForm(todayStr(),null,'direct');}
  else if(a==='dashboard-range'){dashboardRange=el.dataset.range;render();}
  else if(a==='command-add-trade'){modal=null;openForm(todayStr(),null,'direct');}
  else if(a==='command-add-account'){modal=null;view='accounts';render();requestAnimationFrame(()=>document.getElementById('accountName')?.focus());}
  else if(a==='command-jump-month'){const value=document.getElementById('commandMonth')?.value;if(!/^\d{4}-\d{2}$/.test(value||'')){toast('Choose a month to open.',true);return;}const [year,month]=value.split('-').map(Number);calMonth=new Date(year,month-1,1);view='calendar';modal=null;render();}
  else if(a==='add-trade-day'){openForm(el.dataset.date,null,'day');}
  else if(a==='open-day'){openDay(el.dataset.date);}
  else if(a==='detail-trade'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t){modal={mode:'detail',trade:t};render();}}
  else if(a==='edit-trade'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t)openForm(t.date,t,(modal&&modal.mode==='day')?'day':'direct');}
  else if(a==='edit-detail'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t)openForm(t.date,t,'detail');}
  else if(a==='delete-trade'){await deleteTrade(el.dataset.id);}
  else if(a==='close-modal'){closeModal();}
  else if(a==='close-image'){closeModal();}
  else if(a==='cancel-form'){backFromForm();}
  else if(a==='cal-prev'){calMonth.setMonth(calMonth.getMonth()-1);render();}
  else if(a==='cal-next'){calMonth.setMonth(calMonth.getMonth()+1);render();}
  else if(a==='cal-today'){calMonth=new Date();calMonth.setDate(1);render();}
  else if(a==='clear-journal-filters'){journalFilters.search='';journalFilters.account='';journalFilters.direction='';journalFilters.result='';journalFilters.tag='';render();}
  else if(a==='set-theme'){const prior=S.settings.theme;S.settings.theme=el.dataset.theme;applyTheme();try{await persistSettings();render();}catch(err){S.settings.theme=prior;applyTheme();toast(err.message,true);}}
  else if(a==='toggle-background'){const prior=S.settings.backgroundAnimation;S.settings.backgroundAnimation=!prior;try{await persistSettings();render();toast(`Dashboard background ${S.settings.backgroundAnimation?'enabled':'disabled'}.`);}catch(error){S.settings.backgroundAnimation=prior;render();toast(error.message,true);}}
  else if(a==='export-csv'){exportCsv();}
  else if(a==='export-month-csv'){exportMonthCsv();}
  else if(a==='copy-csv'){navigator.clipboard.writeText(modal.text).then(()=>toast('Copied to clipboard.')).catch(()=>toast('Could not copy — select the text and copy manually.',true));}
  else if(a==='toggle-emotion'){const pressed=el.getAttribute('aria-pressed')==='true';el.setAttribute('aria-pressed',String(!pressed));}
  else if(a==='remove-tag'){el.closest('[data-chip]')?.remove();}
  else if(a==='add-account-form'){await addAccount({name:document.getElementById('f-new-account')?.value||'',kind:document.getElementById('f-new-account-kind')?.value||'personal',initialBalance:document.getElementById('f-new-account-balance')?.value||''},true);}
  else if(a==='toggle-account-archive'){
    const account=S.accounts.find(item=>item.id===el.dataset.id);if(!account)return;const old=account.archived,previous=S.settings.activeAccountId||'all';account.archived=!old;if(account.archived&&previous===account.id)S.settings.activeAccountId='all';
    try{await persistSettings();render();toast(account.archived?'Account archived.':'Account restored.');}catch(error){account.archived=old;S.settings.activeAccountId=previous;toast(error.message,true);}
  }
  else if(a==='remove-account'){
    const index=S.accounts.findIndex(account=>account.id===el.dataset.id),old=S.accounts[index];if(!old)return;
    if(accountTrades(old).length||accountDailyResults(old).length){toast('Archive this account to keep its trades and daily results.',true);return;}
    if(!confirm(`Delete ${old.name}? This account has no trades or daily results.`))return;
    const previousSelection=S.settings.activeAccountId||'all';S.accounts.splice(index,1);if(previousSelection===old.id)S.settings.activeAccountId='all';
    try{await persistSettings();render();toast('Trading account removed.');}catch(err){S.accounts.splice(index,0,old);S.settings.activeAccountId=previousSelection;toast(err.message,true);}
  }
  else if(a==='remove-image'){
    if(!modal||modal.mode!=='form')return;
    const id=el.dataset.id;modal.keptImageIds=modal.keptImageIds.filter(x=>x!==id);modal.newImages=modal.newImages.filter(x=>x.id!==id);renderImagePreviews();
  }
  else if(a==='preview-image'){
    const id=el.dataset.id;
    const existing=(modal.trade?.images||[]).find(i=>i.id===id);
    const image=existing||modal.newImages.find(i=>i.id===id);
    if(image)showImage(image,modal);
  }
  else if(a==='open-image'){
    const t=S.trades.find(x=>x.id===el.dataset.tradeId),image=t?.images?.find(i=>i.id===el.dataset.id);
    if(t&&image){const returnModal=modal||{mode:'detail',trade:t};showImage(image,returnModal);}
  }
});

document.addEventListener('change',async e=>{
  if(e.target.id==='activeAccountSelect'){
    const previous=S.settings.activeAccountId||'all';S.settings.activeAccountId=e.target.value||'all';journalFilters.account='';
    try{await persistSettings();render();}
    catch(err){S.settings.activeAccountId=previous;render();toast(err.message,true);}
    return;
  }else if(e.target.id==='dayAccountSelect'&&modal?.mode==='day'){
    modal.accountId=e.target.value;render();return;
  }else if(e.target.id==='commandAccountSelect'&&modal?.mode==='command'){
    const previous=S.settings.activeAccountId||'all';S.settings.activeAccountId=e.target.value||'all';journalFilters.account='';
    try{await persistSettings();modal=null;render();}catch(error){S.settings.activeAccountId=previous;render();toast(error.message,true);}return;
  }else if(e.target.matches('[data-journal-filter]')){
    const field=e.target.dataset.journalFilter;journalFilters[field]=e.target.value;
    if(field==='scope')render();else updateJournalResults();
    return;
  }else if(e.target.id==='riskDirection'){
    riskDraft.direction=e.target.value;const holder=document.getElementById('riskResult');if(holder)holder.innerHTML=riskResultHtml();
  }else if(e.target.id==='currencySelect'){
    const old=S.settings.currency;S.settings.currency=e.target.value;try{await persistSettings();render();}catch(err){S.settings.currency=old;toast(err.message,true);}
  }else if(e.target.id==='screenshotInput'){
    await addImageFiles(e.target.files);e.target.value='';
  }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='authForm'){e.preventDefault();await handleAuthSubmit(e.target);}
  else if(e.target.id==='tradeForm'){e.preventDefault();await handleTradeFormSubmit(e.target);}
  else if(e.target.id==='dailyResultForm'){e.preventDefault();await saveDailyResult(e.target);}
  else if(e.target.id==='accountForm'){e.preventDefault();await addAccount(Object.fromEntries(new FormData(e.target).entries()));}
  else if(e.target.matches('.account-meta-form')){e.preventDefault();await updateAccount(e.target);}
  else if(e.target.id==='goalsForm'){e.preventDefault();await saveGoals(e.target);}
  else if(e.target.id==='weeklyReviewForm'){e.preventDefault();await saveWeeklyReview(e.target);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='journalSearch'){journalFilters.search=e.target.value;updateJournalResults();return;}
  if(e.target.id==='commandSearch'){const query=e.target.value.trim().toLocaleLowerCase();document.querySelectorAll('.command-item').forEach(item=>{item.hidden=!!query&&!item.textContent.toLocaleLowerCase().includes(query);});return;}
  const map={riskBalance:'balance',riskPercent:'riskPercent',riskEntry:'entry',riskStop:'stop',riskTarget:'target',riskPointValue:'pointValue'};
  const field=map[e.target.id];if(!field)return;
  riskDraft[field]=e.target.value;const holder=document.getElementById('riskResult');if(holder)holder.innerHTML=riskResultHtml();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='tagInput'){e.preventDefault();addTag(e.target.value);e.target.value='';}
  if(modal?.mode==='command'&&e.target.id==='commandSearch'&&e.key==='Enter'){e.preventDefault();document.querySelector('.command-item:not([hidden])[data-action]')?.click();return;}
  if(modal?.mode==='command'&&e.target.id==='commandMonth'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-action="command-jump-month"]:not(.command-month-item)')?.click();return;}
  if(modal?.mode==='command'&&e.target.id==='commandSearch'&&e.key==='ArrowDown'){e.preventDefault();document.querySelector('.command-item:not([hidden])[data-action]')?.focus();return;}
  if(modal?.mode==='command'&&e.target.matches('.command-item[data-action]')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const items=[...document.querySelectorAll('.command-item[data-action]:not([hidden])')],index=items.indexOf(e.target),next=items[(index+(e.key==='ArrowDown'?1:items.length-1))%items.length];next?.focus();return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&modal?.mode==='form'){e.preventDefault();document.getElementById('tradeForm')?.requestSubmit();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(modal?.mode==='command')closeModal();else if(!modal)openCommandPalette();return;}
  if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key.toLowerCase()==='n'&&!modal&&!e.target.closest('input,textarea,select,[contenteditable="true"]')){e.preventDefault();openForm(todayStr(),null,'direct');return;}
  if(e.key==='Escape'&&modal){closeModal();}
  if(e.target.matches('.cal-cell[data-action="open-day"]')){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();openDay(e.target.dataset.date);return;}
    const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    if(offset){e.preventDefault();const date=new Date(`${e.target.dataset.date}T00:00:00`);date.setDate(date.getDate()+offset);const next=dstr(date.getFullYear(),date.getMonth(),date.getDate());if(date.getMonth()!==calMonth.getMonth()||date.getFullYear()!==calMonth.getFullYear()){calMonth=new Date(date.getFullYear(),date.getMonth(),1);render();document.querySelector(`.cal-cell[data-date="${next}"]`)?.focus();}else document.querySelector(`.cal-cell[data-date="${next}"]`)?.focus();}
  }
});
document.addEventListener('paste',async e=>{
  if(!modal||modal.mode!=='form'||!e.clipboardData)return;
  const files=[];for(const item of e.clipboardData.items){if(item.type.startsWith('image/')){const file=item.getAsFile();if(file)files.push(file);}}
  if(files.length){e.preventDefault();await addImageFiles(files);}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#uploadZone'))e.preventDefault();});
document.addEventListener('drop',async e=>{if(e.target.closest('#uploadZone')){e.preventDefault();await addImageFiles(e.dataTransfer.files);}});

initApp();

</script>
</body>
