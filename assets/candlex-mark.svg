<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="CandleX" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2636"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B64C" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3A4560" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2FBF8F" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1FA27A"/>
      <stop offset="1" stop-color="#4BE3B0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5CB6A"/>
      <stop offset="1" stop-color="#DE9528"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E8B64C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E8B64C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.3" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>
  <!-- candle 1: profit, runs bottom-left to top-right -->
  <line x1="15" y1="49" x2="49" y2="15" stroke="url(#up)" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="-4.75" y="-12" width="9.5" height="24" rx="3" transform="translate(32 32) rotate(45)" fill="url(#up)"/>
  <!-- candle 2: accent, runs top-left to bottom-right, sits on top with a cut-out edge -->
  <line x1="15" y1="15" x2="49" y2="49" stroke="url(#amber)" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="-4.75" y="-12" width="9.5" height="24" rx="3" transform="translate(32 32) rotate(-45)" fill="url(#amber)" stroke="#0E1217" stroke-width="2.2" paint-order="stroke"/>
</svg>
